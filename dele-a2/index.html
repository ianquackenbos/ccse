<style>
/* Layout: same answer-sheet system as Repaso CCSE; reading column + task stepper; listening uses a play-control strip */
:root{
  --paper:#f5f6f8; --sheet:#ffffff; --ink:#18213a; --ink-2:#4a5570; --ink-3:#7c869e;
  --rule:#dde1ea; --rule-2:#c6ccd9; --tint:#eceff5;
  --accent:#1d5fa8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --gold:#c99a17; --gold-soft:#fbf1d3;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --sheet:#171d31; --ink:#e7eaf3; --ink-2:#aab2c8; --ink-3:#7a849d;
  --rule:#273050; --rule-2:#37416a; --tint:#1e2540;
  --accent:#6ea8ec; --accent-ink:#0b1424; --accent-soft:#1b2c48;
  --gold:#e3b73f; --gold-soft:#3a3018;
  --ok:#4cc58a; --ok-soft:#173528; --bad:#f07168; --bad-soft:#3d1c1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#171d31; --ink:#e7eaf3; --ink-2:#aab2c8; --ink-3:#7a849d;
  --rule:#273050; --rule-2:#37416a; --tint:#1e2540;
  --accent:#6ea8ec; --accent-ink:#0b1424; --accent-soft:#1b2c48;
  --gold:#e3b73f; --gold-soft:#3a3018;
  --ok:#4cc58a; --ok-soft:#173528; --bad:#f07168; --bad-soft:#3d1c1d; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{white-space:nowrap;font-family:var(--display);font-stretch:78%;font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--accent)}
.brand a{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;text-decoration:none}
.brand a:hover{color:var(--ink)}
.langbtn{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:12px;font-family:var(--mono);cursor:pointer;flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 64px}
h1,h2,h3{font-family:var(--display);font-stretch:85%;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:21px;font-weight:750}
h3{font-size:16px;font-weight:700}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:10px 16px;font-weight:650;cursor:pointer;border:1px solid var(--rule-2);background:var(--sheet);min-height:42px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--rule-2);border-radius:999px;padding:6px 12px;background:var(--sheet);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2)}
/* home */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:680px){.grid2{grid-template-columns:1fr}}
.fmt{width:100%;border-collapse:collapse;font-size:14px}
.fmt td,.fmt th{text-align:left;padding:7px 6px;border-top:1px solid var(--rule);vertical-align:top}
.fmt th{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;border-top:0}
.tests{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.trow:first-child{border-top:0}
.tbadge{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px}
.tname{font-weight:650;min-width:0}
.tname small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.best{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:right}
.best b{display:block;font-size:15px;color:var(--ink)}
.trow .row{justify-content:flex-end}
@media (max-width:560px){.trow{grid-template-columns:40px minmax(0,1fr)}.trow .acts{grid-column:1/3}}
.warn{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
/* runner */
.runtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:5;background:var(--paper);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.runbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:18px;font-weight:600;padding:3px 10px;border:1.5px solid var(--ink);border-radius:var(--r)}
.timer.low{border-color:var(--bad);color:var(--bad)}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps button{flex:none;border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:650;cursor:pointer;color:var(--ink-2)}
.steps button[aria-current="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.steps button .c{font-family:var(--mono);font-weight:400;opacity:.75;margin-left:6px}
.instr{font-size:14px;color:var(--ink-2);max-width:70ch;margin:0}
.text{font-size:16px;line-height:1.65;max-width:68ch;white-space:pre-line;text-wrap:pretty}
.text h3{margin-bottom:8px}
.shorttext{border-left:3px solid var(--rule-2);padding:4px 0 4px 14px;font-size:15px;line-height:1.6;max-width:68ch}
.shorttext b{display:block;font-family:var(--display);font-stretch:85%;font-size:15px;margin-bottom:2px}
.item{padding:16px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:10px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 190px)}
.item:first-of-type{border-top:0}
.qhead{display:flex;align-items:baseline;gap:10px}
.qn{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink-3);flex:none;min-width:24px}
.qt{font-weight:600;font-size:16px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:6px;padding-left:34px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:9px 12px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet);cursor:pointer;font-size:15px;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--ink-2)}
.opt.sel{border-color:var(--ink)} .opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt .mark{font-family:var(--mono);font-size:12px;font-weight:700}
.opt.ok .mark{color:var(--ok)} .opt.bad .mark{color:var(--bad)}
.opt[disabled]{cursor:default}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opts.inline .opt{grid-template-columns:28px auto auto}
.sel4{padding-left:34px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel4 select{padding:8px 10px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet);min-width:0;max-width:100%}
.optlist{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:14.5px}
@media (max-width:600px){.optlist{grid-template-columns:1fr}}
.optlist li{display:flex;gap:8px}
.optlist b{font-family:var(--mono);color:var(--accent);flex:none;width:18px}
.optlist li.used{color:var(--ink-3)}
.fb{padding-left:34px;display:flex;flex-direction:column;gap:6px}
.fbline{font-weight:650;font-size:14px}
.fbline.ok{color:var(--ok)} .fbline.bad{color:var(--bad)}
details.why,details.tr{border:1px solid var(--rule);border-radius:var(--r);background:var(--tint)}
details summary{cursor:pointer;padding:7px 12px;font-size:13px;font-weight:650;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details.why p{margin:0;padding:0 12px 10px 25px;font-size:14px;line-height:1.5;color:var(--ink);max-width:70ch}
.script{margin:0;padding:0 12px 10px 25px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.5}
.script span b{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-right:6px;text-transform:uppercase}
/* player */
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--accent-soft)}
.play{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px}
.play[disabled]{opacity:.45;cursor:not-allowed}
.play svg{width:12px;height:12px;fill:currentColor}
.plays{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.playing .play{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.playing .play{animation:none}}
.speed{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-3)}
.speed button{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.who{font-size:13px;font-weight:650;color:var(--accent)}
.voicepick select{padding:7px 10px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet);max-width:100%;min-width:0}
.names{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.names span b{font-family:var(--mono);color:var(--accent);margin-right:4px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.confirm{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* results */
.score{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:56px;line-height:1}
.score small{font-size:22px;color:var(--ink-3)}
.breakdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bd{border:1px solid var(--rule);border-radius:var(--r);padding:10px 4px;text-align:center}
.bd b{display:block;font-family:var(--mono);font-size:18px}
.bd span{font-size:11px;color:var(--ink-3)}
.grid25{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.cell{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--rule-2);background:var(--sheet);font-family:var(--mono);font-size:12px;display:grid;place-items:center;cursor:pointer;color:var(--sheet)}
.cell.ok{background:var(--ok);border-color:var(--ok)} .cell.bad{background:var(--bad);border-color:var(--bad)}
.rv{padding:14px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 110px);border-radius:var(--r)}
.rvh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rvn{display:flex;align-items:center;gap:8px}
.rvn b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--sheet)}
.rvn b.ok{background:var(--ok)} .rvn b.bad{background:var(--bad)}
.rq{font-weight:600}
.ra{font-size:14px;display:flex;flex-direction:column;gap:2px}
.ra .yours{color:var(--bad)} .ra .right{color:var(--ok)}
@keyframes flash{from{background:var(--gold-soft)}to{background:transparent}}
.rv.flash{animation:flash 1.6s ease-out}
@media (prefers-reduced-motion:reduce){.rv.flash{animation:none;outline:2px solid var(--gold)}}
.history{width:100%;border-collapse:collapse;font-size:14px}
.history td,.history th{padding:8px 6px;border-top:1px solid var(--rule);text-align:left}
.history th{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;border-top:0}
.foot{font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:14px;margin-top:30px}
.foot a{color:inherit}
</style>
</head>

  <div class="wrap">

      <div class="brand"><b>Repaso <i>DELE A2</i></b><a href="../" id="ccselink">← CCSE</a></div>

<main class="wrap" id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const READ = [{"id":"R1","title":"Mudanzas y nuevos comienzos","tasks":[{"t":1,"texts":[{"h":"Correo de Lucía a Marta","b":"Asunto: ¡Ya estoy en Valencia!\n\nHola, Marta:\n\n¿Qué tal estás? Perdona por no escribirte antes, pero estas dos semanas han sido una locura. Como sabes, el día 1 empecé en mi nuevo trabajo en una agencia de viajes del centro. Mis compañeros son muy simpáticos y mi jefa, Carmen, me ayuda mucho. Trabajo de lunes a viernes de nueve a tres, así que tengo las tardes libres.\n\nEl piso es pequeño, pero muy bonito. Tiene dos habitaciones, una cocina nueva y un balcón donde desayuno todos los días. Lo malo es que está en un quinto piso y no hay ascensor, ¡pero así hago ejercicio! Está a diez minutos andando de la playa y a quince del trabajo, por eso no necesito el coche. Lo voy a vender el mes que viene.\n\nTodavía no conozco a mucha gente. Mi vecina Rosa, que es profesora de inglés, me invitó a cenar el sábado pasado con unos amigos suyos y lo pasamos muy bien. También me he apuntado a un curso de cerámica los martes y jueves por la tarde.\n\nOye, ¿por qué no vienes a visitarme en octubre? El día 9 es fiesta aquí y tengo un puente de cuatro días. La habitación pequeña es para ti. Podemos ir a la Ciudad de las Artes y las Ciencias y, por supuesto, comer una buena paella. Dime algo pronto para buscar billetes de tren, que en esas fechas suben mucho de precio.\n\nUn beso muy fuerte,\nLucía"}],"items":[{"q":"Lucía escribe a Marta para…","o":["contarle su nueva vida e invitarla.","pedirle ayuda con la mudanza.","explicarle por qué ha dejado su trabajo."],"a":0,"w":"Lucía cuenta cómo es su trabajo, su piso y su vida en Valencia, y al final invita a Marta en octubre."},{"q":"En su nuevo trabajo, Lucía…","o":["trabaja también por las tardes.","tiene una jefa que la ayuda.","no se lleva bien con los compañeros."],"a":1,"w":"Dice: «mi jefa, Carmen, me ayuda mucho». Trabaja de nueve a tres, así que tiene las tardes libres."},{"q":"Sobre su piso, Lucía dice que…","o":["está cerca de la playa.","tiene tres habitaciones.","tiene ascensor."],"a":0,"w":"Está «a diez minutos andando de la playa». Tiene dos habitaciones y no hay ascensor."},{"q":"Lucía va a vender el coche porque…","o":["es muy caro.","no lo necesita.","está estropeado."],"a":1,"w":"El trabajo y la playa están cerca, «por eso no necesito el coche»."},{"q":"Lucía quiere que Marta…","o":["compre los billetes de tren para las dos.","le conteste pronto.","vaya con ella al curso de cerámica."],"a":1,"w":"«Dime algo pronto para buscar billetes»: quiere una respuesta rápida porque los billetes suben de precio."}]},{"t":2,"texts":[{"h":"Gimnasio","b":"GIMNASIO VITAL. ¡Este mes, sin matrícula! Abierto de lunes a sábado de 7:00 a 23:00 y domingos de 9:00 a 14:00. Clases de yoga, pilates y natación incluidas en la cuota. Primera semana gratis si vienes con un amigo. Más información en recepción. Estamos en la calle Goya, 14, a dos minutos de la parada de metro. También tenemos aparcamiento para socios."},{"h":"Biblioteca municipal","b":"AVISO: Del 1 al 15 de agosto la biblioteca cerrará por obras. Durante esos días no se podrán devolver libros, pero no hay que pagar multa por retraso. Los préstamos por internet siguen funcionando con normalidad. Gracias por su comprensión. A partir del 16 de agosto, la biblioteca abrirá con su horario habitual, de lunes a sábado de 9:00 a 21:00."},{"h":"Curso de cocina","b":"¿Te gusta cocinar? Escuela Sabores organiza un curso de cocina vegetariana para principiantes. Seis sesiones, los miércoles de 18:00 a 20:00. Precio: 90 euros con todos los ingredientes. Grupos de máximo diez personas. Inscripciones hasta el 20 de septiembre. Al final del curso, cada alumno recibirá un pequeño libro con todas las recetas. Escríbenos a hola@escuelasabores.es."},{"h":"Se alquila","b":"Se alquila habitación en piso compartido con dos estudiantes, cerca de la universidad. Habitación exterior con armario y escritorio. 350 euros al mes con agua y luz incluidas. No se permiten animales. Preferiblemente chica no fumadora. Llamar por las tardes al 612 345 678. La habitación está libre desde el 1 de octubre. El piso tiene lavadora, cocina completa y un salón grande."},{"h":"Perro perdido","b":"PERDIDO. Se busca perro pequeño, marrón, con una mancha blanca en la cabeza. Se llama Toby y lleva un collar rojo. Se perdió el domingo en el parque del Oeste. Es muy tranquilo y no muerde. Si lo ves, llama a Andrés: 699 112 233. Gratificación. Andrés y su familia están muy tristes porque Toby vive con ellos desde hace ocho años."},{"h":"Museo de la Ciudad","b":"MUSEO DE LA CIUDAD. Horario: de martes a domingo, de 10:00 a 19:00. Lunes cerrado. Entrada general: 6 euros. Estudiantes y mayores de 65: 3 euros. Entrada gratuita los domingos por la tarde. Visitas guiadas los sábados a las 12:00, con reserva previa. El museo tiene una cafetería en la planta baja y una tienda de regalos. Está prohibido hacer fotos con flash."},{"h":"Huelga de trenes","b":"Renfe informa: debido a la huelga convocada para el próximo viernes, se cancelarán el 50 % de los trenes de cercanías. Los viajeros con billete para ese día pueden cambiarlo gratis por otro día o pedir la devolución del dinero en las taquillas. Los trenes de media y larga distancia funcionarán con normalidad. Más información en la web y en el teléfono de atención al cliente."},{"h":"Voluntarios","b":"La asociación Manos Amigas busca voluntarios para acompañar a personas mayores dos horas a la semana. No necesitas experiencia: te damos una formación gratuita. Solo pedimos ser mayor de 18 años y tener ganas de ayudar. Escríbenos a info@manosamigas.org. Las actividades son por las tardes o los fines de semana, en el barrio que tú prefieras. ¡Únete a nuestro equipo!"}],"items":[{"x":0,"q":"En el Gimnasio Vital…","o":["hay que pagar aparte las clases de yoga.","los domingos abren solo por la mañana.","la primera semana es gratis para todos."],"a":1,"w":"Los domingos abren de 9:00 a 14:00. Las clases están incluidas y la semana gratis es solo si vas con un amigo."},{"x":1,"q":"Durante las obras de la biblioteca…","o":["se pueden pedir libros por internet.","hay que pagar si devuelves tarde un libro.","se pueden devolver libros en la entrada."],"a":0,"w":"«Los préstamos por internet siguen funcionando con normalidad»."},{"x":2,"q":"En el curso de cocina…","o":["los alumnos traen los ingredientes.","se aprende a cocinar con carne y pescado.","no puede haber más de diez alumnos."],"a":2,"w":"«Grupos de máximo diez personas». Los ingredientes están incluidos y la cocina es vegetariana."},{"x":3,"q":"La habitación que se alquila…","o":["incluye los gastos de agua y luz.","es ideal para una persona con perro.","está en un piso con familias."],"a":0,"w":"«350 euros al mes con agua y luz incluidas». No se permiten animales y se comparte con estudiantes."},{"x":4,"q":"El perro Toby…","o":["es grande y negro.","se perdió en un parque.","es un poco peligroso."],"a":1,"w":"«Se perdió el domingo en el parque del Oeste». Es pequeño, marrón, y no muerde."},{"x":5,"q":"En el Museo de la Ciudad…","o":["los estudiantes no pagan.","se puede entrar gratis algunos días.","las visitas guiadas son sin reserva."],"a":1,"w":"La entrada es gratuita los domingos por la tarde. Los estudiantes pagan 3 euros y las visitas guiadas necesitan reserva."},{"x":6,"q":"Los viajeros afectados por la huelga…","o":["pueden recuperar el dinero del billete.","tienen que pagar para cambiar el billete.","no pueden viajar en ningún tren."],"a":0,"w":"Pueden cambiar el billete gratis o «pedir la devolución del dinero». Solo se cancela la mitad de los trenes."},{"x":7,"q":"Para ser voluntario en Manos Amigas…","o":["hay que tener experiencia.","es necesario pagar un curso.","hay que ser mayor de edad."],"a":2,"w":"«Solo pedimos ser mayor de 18 años». No hace falta experiencia y la formación es gratuita."}]},{"t":3,"texts":[{"h":"A. Hostal La Brisa","b":"El Hostal La Brisa está en primera línea de playa, en un pueblo tranquilo de la costa. Todas las habitaciones tienen aire acondicionado y la mayoría, vistas al mar. El desayuno está incluido en el precio y se sirve en la terraza hasta las once. No tenemos aparcamiento propio, pero hay uno público a cien metros. Es un lugar perfecto para descansar: no admitimos grupos grandes ni fiestas. Ofrecemos un descuento del 15 % para estancias de más de una semana. Las habitaciones son sencillas pero cómodas, y todas tienen baño propio. Muy cerca hay un pequeño puerto, una farmacia y varios restaurantes de pescado. El hostal está abierto de abril a octubre."},{"h":"B. Albergue Montaña Verde","b":"El Albergue Montaña Verde está en pleno parque natural, a 1.200 metros de altura. Tenemos habitaciones compartidas de cuatro y seis camas, y dos habitaciones dobles. Hay cocina para los huéspedes, así que puedes preparar tu propia comida. Organizamos rutas a pie y en bicicleta todos los fines de semana con un guía. Los animales de compañía son bienvenidos. Atención: no hay cobertura de móvil en la zona, pero sí wifi en el comedor. El albergue está a cuarenta minutos de la ciudad más cercana por una carretera de montaña. Las habitaciones compartidas tienen taquillas, y las sábanas están incluidas en el precio. Abrimos todo el año."},{"h":"C. Hotel Plaza Mayor","b":"El Hotel Plaza Mayor está en el casco antiguo de la ciudad, al lado de los principales museos y monumentos. Las habitaciones son modernas y tienen televisión y caja fuerte. El restaurante del hotel ofrece cocina tradicional de la región. Tenemos aparcamiento privado por 15 euros al día. Es ideal para familias: los niños menores de doce años no pagan si duermen con sus padres. Recepción abierta las 24 horas. El hotel tiene ochenta habitaciones repartidas en cuatro plantas, todas con ascensor. Desde la terraza de la última planta hay unas vistas preciosas de la catedral. Se aceptan todas las tarjetas."}],"items":[{"q":"Aquí puedes hacer excursiones con un guía.","a":1,"w":"El albergue organiza «rutas a pie y en bicicleta todos los fines de semana con un guía»."},{"q":"Es más barato si te quedas muchos días.","a":0,"w":"El hostal ofrece «un descuento del 15 % para estancias de más de una semana»."},{"q":"Los niños pequeños no pagan.","a":2,"w":"En el hotel, los menores de doce años no pagan si duermen con sus padres."},{"q":"Puedes cocinar tú mismo.","a":1,"w":"El albergue tiene «cocina para los huéspedes»."},{"q":"El desayuno no se paga aparte.","a":0,"w":"En el hostal «el desayuno está incluido en el precio»."},{"q":"Puedes dejar el coche en el mismo establecimiento, pagando.","a":2,"w":"El hotel tiene «aparcamiento privado por 15 euros al día». El hostal no tiene aparcamiento propio."}]},{"t":4,"texts":[{"h":"Blog «Mi vida en el campo» — Por qué dejé la ciudad","b":"Hace tres años vivía en Madrid, trabajaba en un banco y pasaba casi dos horas al día en el metro. Ganaba bastante dinero, pero siempre estaba cansado y casi nunca veía a mis amigos. Un día, mi abuela me llamó por teléfono: estaba enferma y necesitaba ayuda en su casa de un pueblo de Teruel, donde viven solo ochenta personas. Pedí unas vacaciones de un mes para cuidarla. Al principio pensaba que me iba a aburrir muchísimo.\n\nPero no fue así. Por las mañanas trabajaba en el huerto de mi abuela con mi vecino Julián, un señor de setenta años que lo sabe todo sobre tomates y patatas. Por las tardes paseaba por el monte o leía en la plaza. Por primera vez en mucho tiempo dormía ocho horas seguidas. Mi abuela se recuperó pronto y me dijo una frase que nunca voy a olvidar: «Aquí tienes menos cosas, pero más tiempo».\n\nCuando volví a Madrid, no podía dejar de pensar en el pueblo. Seis meses después, dejé el banco. No fue una decisión fácil: mis padres pensaban que estaba loco y yo tenía miedo de no encontrar trabajo. Sin embargo, el pueblo tenía conexión a internet y yo sabía diseñar páginas web, algo que antes hacía solo como afición. Empecé con dos clientes, que eran amigos míos, y poco a poco llegaron más.\n\nHoy vivo con mi abuela, trabajo desde casa cuatro o cinco horas al día y gano menos dinero que antes, pero gasto mucho menos. Tengo un huerto propio y en verano vendo mis verduras en el mercado de la capital de la provincia. Además, he convencido a dos amigos de Madrid para venir a vivir aquí: uno ha abierto una pequeña panadería y el otro da clases de yoga en el antiguo colegio, que estaba cerrado desde hacía diez años.\n\nNo digo que la vida en el campo sea perfecta. En invierno hace mucho frío, el médico solo viene dos días a la semana y para ir al cine hay que conducir una hora. Pero cuando alguien me pregunta si echo de menos la ciudad, siempre respondo lo mismo: solo un poco, y solo los domingos. Mi abuela, por cierto, ahora dice que soy el mejor nieto del mundo."}],"items":[{"q":"Cuando vivía en Madrid, el autor…","o":["tenía poco dinero.","pasaba mucho tiempo en el transporte.","veía mucho a sus amigos."],"a":1,"w":"Pasaba «casi dos horas al día en el metro». Ganaba bastante y casi nunca veía a sus amigos."},{"q":"El autor fue al pueblo por primera vez para…","o":["ayudar a su abuela.","buscar un trabajo nuevo.","pasar unas vacaciones con amigos."],"a":0,"w":"Su abuela estaba enferma y necesitaba ayuda; pidió vacaciones para cuidarla."},{"q":"Durante su primer mes en el pueblo, el autor…","o":["se aburrió mucho.","durmió mejor que en Madrid.","trabajó en el huerto con su abuela."],"a":1,"w":"«Por primera vez en mucho tiempo dormía ocho horas seguidas». Trabajaba en el huerto con su vecino Julián, no con su abuela."},{"q":"Cuando decidió dejar el banco, sus padres…","o":["no estaban de acuerdo.","le dieron dinero.","se fueron a vivir con él."],"a":0,"w":"«Mis padres pensaban que estaba loco»."},{"q":"Ahora el autor…","o":["gana más dinero que antes.","trabaja como diseñador de páginas web.","tiene una panadería."],"a":1,"w":"Sabía diseñar páginas web y empezó con dos clientes. La panadería es de un amigo."},{"q":"Según el autor, un problema del pueblo es que…","o":["no hay internet.","no hay médico todos los días.","no hay colegio para los niños."],"a":1,"w":"«El médico solo viene dos días a la semana». Sí hay internet; el antiguo colegio ahora se usa para yoga."}]}]},{"id":"R2","title":"Trabajo y estudios","tasks":[{"t":1,"texts":[{"h":"Correo de Javier a su prima Elena","b":"Asunto: Noticias desde Sevilla\n\nQuerida Elena:\n\nMuchas gracias por tu mensaje y por las fotos de tu boda. ¡Estabas guapísima! Siento mucho no haber podido ir, pero en esas fechas tenía los exámenes finales y no podía viajar.\n\nTe cuento: por fin he terminado el curso de cocina profesional. Fueron dos años muy duros, porque por las mañanas iba a clase y por las tardes trabajaba en una tienda de ropa. Pero valió la pena: saqué muy buenas notas y en junio empecé a trabajar en un restaurante italiano cerca de la catedral. De momento soy ayudante de cocina, así que lavo verduras, preparo salsas y, a veces, hago los postres. El horario es difícil, porque termino casi a medianoche, pero los domingos y los lunes descanso.\n\nEl chef se llama Paolo y es de Nápoles. Es un poco serio, pero enseña muy bien. Gracias a él estoy aprendiendo también algo de italiano. Mi plan es trabajar aquí un par de años y después abrir un pequeño restaurante con mi amigo Toni, que es camarero.\n\nPor cierto, mis padres me han dicho que tú y Daniel vais a buscar casa en Sevilla. Si queréis, en noviembre podéis quedaros unos días en mi piso: tengo un sofá cama bastante cómodo. Y así os preparo una cena especial. ¡Será mi regalo de boda!\n\nEscríbeme cuando sepáis las fechas.\n\nUn abrazo muy grande,\nJavier\n\nP. D.: Mamá dice que traigáis ropa de abrigo, porque en noviembre aquí ya refresca por las noches."}],"items":[{"q":"Javier no fue a la boda de Elena porque…","o":["estaba trabajando en el restaurante.","tenía que estudiar para los exámenes.","estaba de viaje en Italia."],"a":1,"w":"«En esas fechas tenía los exámenes finales y no podía viajar»."},{"q":"Mientras hacía el curso, Javier…","o":["trabajaba por las tardes.","vivía con sus padres.","estudiaba italiano."],"a":0,"w":"«Por las mañanas iba a clase y por las tardes trabajaba en una tienda de ropa»."},{"q":"En el restaurante, Javier…","o":["es el chef principal.","prepara a veces los postres.","trabaja los domingos."],"a":1,"w":"Es ayudante de cocina y «a veces, hago los postres». Descansa los domingos y los lunes."},{"q":"Sobre Paolo, Javier dice que…","o":["es muy divertido.","es un buen profesor.","quiere abrir un restaurante con él."],"a":1,"w":"«Es un poco serio, pero enseña muy bien». El restaurante lo quiere abrir con Toni."},{"q":"Javier ofrece a Elena y a Daniel…","o":["un regalo de boda caro.","ayudarles a buscar trabajo.","dormir en su casa."],"a":2,"w":"Les ofrece quedarse en su piso, en el sofá cama, y prepararles una cena."}]},{"t":2,"texts":[{"h":"Clínica dental","b":"CLÍNICA DENTAL SONRISA. Primera visita y revisión gratuitas. Abrimos de lunes a viernes de 9:00 a 21:00 sin interrupción. Para pedir cita, llame al 954 222 333 o use nuestra aplicación. Si no puede venir, avise con 24 horas de antelación, por favor. Estamos en la avenida de la Constitución, 8, primer piso. Tenemos especialistas en ortodoncia para niños y adultos."},{"h":"Piscina municipal","b":"NORMAS DE LA PISCINA. Es obligatorio usar gorro de baño y ducharse antes de entrar en el agua. Los menores de 12 años deben estar acompañados por un adulto. No está permitido comer en la zona de césped, solo en la cafetería. Horario de verano: de 11:00 a 20:00. La entrada cuesta 4 euros para adultos y 2 euros para niños. Hay taquillas en los vestuarios."},{"h":"Oferta de trabajo","b":"Bar La Esquina busca camarero o camarera para los fines de semana. Horario: viernes y sábado de 19:00 a 1:00. Se valora experiencia, pero no es imprescindible. Imprescindible hablar inglés. Interesados, traer el currículum al bar de lunes a jueves por la mañana. El bar está en la plaza del Mercado, 3. Ofrecemos contrato de seis meses y buen ambiente de trabajo."},{"h":"Concierto","b":"CONCIERTO SOLIDARIO en la plaza del Ayuntamiento, el sábado 14 a las 21:00. Actuarán tres grupos locales de rock y flamenco. La entrada es gratuita, pero se pide llevar un kilo de comida no perecedera para el Banco de Alimentos. En caso de lluvia, el concierto será en el polideportivo. Además de la música, habrá puestos de comida y bebida de varias asociaciones del barrio. ¡No faltes!"},{"h":"Supermercado","b":"¡OFERTA DE LA SEMANA! En Supermercados Ahorra, si compras dos botellas de aceite de oliva, la tercera es gratis. Además, los martes, 10 % de descuento en fruta y verdura. Ahora también puedes hacer la compra por internet: envío gratis a partir de 50 euros. Nuestras tiendas abren de lunes a sábado de 9:00 a 21:30. Oferta válida hasta el 30 de este mes."},{"h":"Farmacia","b":"FARMACIA LÓPEZ. Esta semana, la farmacia de guardia es la Farmacia Central, en la calle Mayor, 25, abierta las 24 horas. Nuestro horario habitual es de 9:30 a 14:00 y de 17:00 a 20:30. Sábados por la tarde y domingos, cerrado. En nuestra farmacia también puede tomarse la tensión gratis y recibir consejos sobre alimentación."},{"h":"Alquiler de bicicletas","b":"BICI CIUDAD. Alquila una bicicleta con tu móvil en cualquiera de nuestras 40 estaciones. La primera media hora es gratis; después, 50 céntimos cada 30 minutos. Debes devolver la bicicleta en una estación antes de las 24 horas. Uso permitido para mayores de 16 años. Para usar el servicio, descarga la aplicación y regístrate con tu tarjeta de crédito. Las bicis tienen luces y una cesta."},{"h":"Intercambio de idiomas","b":"¿Quieres practicar idiomas? Cada jueves a las 20:00 nos reunimos en la cafetería Babel para hablar en español, inglés, francés y alemán. Es gratis y no hay que inscribirse: solo tienes que venir. Cada persona paga su consumición. ¡Te esperamos! Normalmente vienen entre veinte y treinta personas de muchos países diferentes. El ambiente es muy agradable."}],"items":[{"x":0,"q":"En la clínica dental…","o":["la primera visita no cuesta nada.","cierran a mediodía.","solo se puede pedir cita por teléfono."],"a":0,"w":"«Primera visita y revisión gratuitas». Abren sin interrupción y también se puede usar la aplicación."},{"x":1,"q":"En la piscina municipal…","o":["se puede comer en el césped.","los niños pequeños no pueden ir solos.","no es necesario ducharse."],"a":1,"w":"«Los menores de 12 años deben estar acompañados por un adulto»."},{"x":2,"q":"Para trabajar en el Bar La Esquina…","o":["hay que tener experiencia.","es necesario saber inglés.","hay que enviar el currículum por correo electrónico."],"a":1,"w":"«Imprescindible hablar inglés». La experiencia no es imprescindible y el currículum se lleva al bar."},{"x":3,"q":"Para entrar al concierto…","o":["hay que comprar una entrada.","se pide llevar comida.","hay que ir al polideportivo."],"a":1,"w":"La entrada es gratis, pero «se pide llevar un kilo de comida». El polideportivo es solo si llueve."},{"x":4,"q":"En Supermercados Ahorra…","o":["el aceite tiene descuento los martes.","el envío es siempre gratuito.","puedes llevarte un aceite gratis."],"a":2,"w":"Si compras dos botellas de aceite, la tercera es gratis. El descuento de los martes es en fruta y verdura."},{"x":5,"q":"Según el anuncio, la Farmacia López…","o":["está abierta las 24 horas esta semana.","no abre los domingos.","está en la calle Mayor."],"a":1,"w":"«Sábados por la tarde y domingos, cerrado». La de guardia es la Farmacia Central."},{"x":6,"q":"Con Bici Ciudad…","o":["los primeros 30 minutos son gratis.","puedes tener la bici varios días.","pueden usar las bicis niños de 12 años."],"a":0,"w":"«La primera media hora es gratis». Hay que devolverla antes de 24 horas y es para mayores de 16."},{"x":7,"q":"Para ir al intercambio de idiomas…","o":["hay que pagar una cuota.","hay que apuntarse antes.","solo hay que presentarse en la cafetería."],"a":2,"w":"«No hay que inscribirse: solo tienes que venir». Solo se paga lo que tomas."}]},{"t":3,"texts":[{"h":"A. Recepcionista de hotel","b":"Hotel del centro de Málaga busca recepcionista para el turno de noche, de 23:00 a 7:00. Ofrecemos contrato de un año y la posibilidad de vivir en una habitación del hotel durante los primeros meses. Buscamos una persona responsable, con buen nivel de inglés y alemán. No es necesario tener experiencia porque damos formación. Incorporación inmediata. Enviar currículum con foto a rrhh@hotelsol.es. El hotel tiene cuatro estrellas y doscientas habitaciones, y está a cinco minutos andando del puerto. Las tareas del puesto son atender a los clientes, hacer reservas y contestar al teléfono."},{"h":"B. Monitor de campamento","b":"Campamento de verano en los Pirineos necesita monitores para el mes de julio. Trabajarás con niños de 8 a 14 años: deportes, juegos y excursiones por la montaña. Comida y alojamiento incluidos. Es necesario tener el título de monitor de tiempo libre y carné de conducir. Se valorará saber tocar algún instrumento musical. Salario: 900 euros al mes. El campamento está en un pequeño valle, cerca de un río, y recibe cada año a unos ochenta niños. Los monitores trabajan en equipos de cuatro personas y tienen un día libre a la semana."},{"h":"C. Dependiente en librería","b":"Librería familiar en Salamanca busca dependiente a media jornada, de lunes a viernes por la tarde. Tareas: atender a los clientes, ordenar libros y llevar las redes sociales de la tienda. Pedimos experiencia mínima de un año en comercio y que te guste leer. Ofrecemos contrato indefinido y descuento del 30 % en todos los libros. Interesados, pasar por la tienda. La librería está en una calle peatonal del centro histórico y tiene más de cuarenta años. Además de libros, vendemos material de papelería y organizamos presentaciones con autores."}],"items":[{"q":"En este trabajo se trabaja por la noche.","a":0,"w":"El hotel busca recepcionista «para el turno de noche, de 23:00 a 7:00»."},{"q":"Hay que tener carné de conducir.","a":1,"w":"El campamento pide «título de monitor de tiempo libre y carné de conducir»."},{"q":"El trabajo es solo para unas semanas.","a":1,"w":"El campamento necesita monitores solo «para el mes de julio»."},{"q":"Se puede trabajar sin experiencia.","a":0,"w":"En el hotel «no es necesario tener experiencia porque damos formación». La librería pide un año de experiencia."},{"q":"Te ofrecen comprar más barato.","a":2,"w":"La librería ofrece «descuento del 30 % en todos los libros»."},{"q":"Hay que entregar el currículum en persona.","a":2,"w":"En la librería: «Interesados, pasar por la tienda». En el hotel se envía por correo electrónico."}]},{"t":4,"texts":[{"h":"Carmen Ruiz, la cartera que se hizo escritora","b":"Carmen Ruiz nació en 1968 en un pequeño pueblo de Asturias. Era la mayor de cinco hermanos y, como sus padres tenían una granja de vacas, desde niña tuvo que ayudar mucho en casa. A los dieciséis años dejó el instituto y empezó a trabajar en la panadería de su tío. Siempre le gustó leer, pero en su casa había pocos libros, así que cada sábado iba en autobús a la biblioteca de Oviedo.\n\nCon veintitrés años aprobó unas oposiciones y se convirtió en cartera. Durante casi veinte años repartió cartas por los pueblos de montaña, primero a pie y después en una moto pequeña. Ella dice que fue la mejor escuela para una escritora: «La gente me contaba sus problemas, sus amores, sus secretos. Yo escuchaba y, por la noche, lo escribía todo en un cuaderno».\n\nEn 2009 su hija le regaló un ordenador portátil y la animó a escribir una novela con esas historias. Carmen escribía de cinco a siete de la mañana, antes de ir a trabajar. Tardó tres años en terminar Cartas que nunca llegaron. Doce editoriales rechazaron el libro. Por fin, una editorial pequeña de Gijón decidió publicarlo en 2013, pero solo imprimió quinientos ejemplares.\n\nEntonces pasó algo inesperado. Una periodista de radio leyó la novela durante unas vacaciones y habló de ella en su programa. En pocas semanas, el libro se vendió en toda España. Al año siguiente ganó un premio importante y hoy está traducido a quince idiomas. En 2018 se estrenó una película basada en la novela, aunque a Carmen no le gustó demasiado el final.\n\nAhora Carmen ya no reparte cartas: vive en Gijón, ha publicado otras cuatro novelas y da talleres de escritura en institutos. Pero no ha cambiado sus costumbres. Sigue escribiendo a mano en cuadernos antes de pasarlo todo al ordenador, y sigue levantándose a las cinco. «Ya no tengo que ir a trabajar», explica, «pero a esa hora la casa está en silencio y las ideas llegan solas».\n\nHoy, sus novelas se estudian en algunos institutos de Asturias."}],"items":[{"q":"Cuando era joven, Carmen…","o":["vivía en Oviedo.","tenía muchos libros en casa.","trabajó en una panadería."],"a":2,"w":"A los dieciséis años «empezó a trabajar en la panadería de su tío». Iba a Oviedo solo a la biblioteca."},{"q":"Según Carmen, su trabajo de cartera…","o":["le dio ideas para escribir.","era muy aburrido.","no le dejaba tiempo para leer."],"a":0,"w":"Dice que fue «la mejor escuela para una escritora»: escuchaba las historias de la gente y las escribía."},{"q":"Carmen escribió su primera novela…","o":["por las noches.","temprano por la mañana.","durante sus vacaciones."],"a":1,"w":"«Escribía de cinco a siete de la mañana, antes de ir a trabajar»."},{"q":"Al principio, la primera novela…","o":["tuvo mucho éxito.","la publicó una editorial grande.","tuvo problemas para publicarse."],"a":2,"w":"Doce editoriales la rechazaron y la primera edición fue solo de quinientos ejemplares."},{"q":"El libro se hizo famoso gracias a…","o":["un programa de radio.","una película.","un premio."],"a":0,"w":"Una periodista habló de él en su programa de radio y entonces se vendió en toda España. El premio y la película llegaron después."},{"q":"Hoy, Carmen…","o":["escribe directamente en el ordenador.","sigue trabajando de cartera.","mantiene su horario de escritura."],"a":2,"w":"Sigue levantándose a las cinco para escribir. Escribe primero a mano y ya no reparte cartas."}]}]},{"id":"R3","title":"Tiempo libre y ciudad","tasks":[{"t":1,"texts":[{"h":"Correo de Sara a la familia Martín","b":"Asunto: ¡Muchas gracias por todo!\n\nQueridos Pilar y Antonio:\n\nYa estoy otra vez en Lyon. El viaje de vuelta fue largo, porque el avión salió con tres horas de retraso, pero llegué bien. Mi madre os manda muchos saludos y os da las gracias por cuidarme tan bien durante estos tres meses.\n\nOs echo mucho de menos. Echo de menos los desayunos con churros los domingos, los paseos por la Plaza Mayor y, sobre todo, nuestras conversaciones en la cena. Cuando llegué a Salamanca casi no entendía nada, ¿os acordáis? Y ahora mi profesora de aquí dice que hablo español mucho mejor. Creo que aprendí más en vuestra casa que en la academia.\n\nAyer empecé otra vez la universidad. Este año tengo muchas asignaturas y tengo que estudiar bastante, pero he decidido seguir con el español: voy a clases dos veces por semana y he encontrado un intercambio con un chico de Bilbao que estudia aquí. Nos vemos los viernes en una cafetería y hablamos una hora en español y otra en francés.\n\nPor cierto, me olvidé en el armario de mi habitación una chaqueta azul. No es importante, no os preocupéis. Si viene alguien de vuestra familia a Francia, me la puede traer; si no, la recojo la próxima vez.\n\nPorque voy a volver, ¡seguro! Quiero ir en Semana Santa, si tenéis sitio en casa. Y quiero que vengáis a Lyon en verano: os puedo enseñar la ciudad y mi padre cocina muy bien.\n\nUn abrazo muy fuerte a los dos y a Lola, la gata.\n\nSara"}],"items":[{"q":"Sara escribe a la familia Martín para…","o":["darles las gracias.","pedirles dinero.","explicarles un problema en el viaje."],"a":0,"w":"El correo empieza y termina dando las gracias por los tres meses en su casa. El retraso del avión es solo un detalle."},{"q":"Según Sara, aprendió mucho español…","o":["en la academia de Salamanca.","hablando con la familia.","con su profesora de Lyon."],"a":1,"w":"«Creo que aprendí más en vuestra casa que en la academia»."},{"q":"Ahora, en Lyon, Sara…","o":["ha dejado de estudiar español.","practica español con un chico español.","trabaja en una cafetería."],"a":1,"w":"Hace un intercambio con un chico de Bilbao en una cafetería los viernes."},{"q":"Sobre la chaqueta, Sara dice que…","o":["la necesita urgentemente.","se la pueden enviar por correo.","la puede recoger más adelante."],"a":2,"w":"«No es importante… si no, la recojo la próxima vez»."},{"q":"Sara quiere que la familia…","o":["la visite en Francia.","vaya a Lyon en Semana Santa.","cuide de su gata."],"a":0,"w":"Ella vuelve a Salamanca en Semana Santa e invita a la familia a Lyon en verano. Lola es la gata de la familia Martín."}]},{"t":2,"texts":[{"h":"Ayuntamiento","b":"AYUNTAMIENTO DE SAN ROQUE. Para empadronarse es necesario pedir cita previa en la web municipal. Debe traer su documento de identidad o pasaporte y el contrato de alquiler o las escrituras de la vivienda. La oficina atiende de lunes a viernes de 8:30 a 14:00. En agosto, solo martes y jueves. El empadronamiento es gratuito y el certificado se entrega en el mismo momento."},{"h":"Mercadillo","b":"MERCADILLO DE SEGUNDA MANO. Todos los primeros domingos de mes, en el parque de la Alameda, de 10:00 a 14:00. Puedes vender ropa, libros, juguetes y muebles pequeños. Para tener un puesto, inscríbete antes del jueves. El puesto es gratis para los vecinos del barrio. Habrá también música en directo y una zona con juegos para niños. ¡Ven a pasar un buen rato!"},{"h":"Teatro","b":"TEATRO PRINCIPAL presenta «La casa de las flores», una comedia para toda la familia. Del 3 al 20 de marzo, de miércoles a domingo a las 20:00. Entradas desde 12 euros. Los miércoles, día del espectador: todas las entradas a 8 euros. Venta en taquilla y en internet. La obra dura una hora y media, sin descanso. Las puertas se cierran cinco minutos antes de empezar."},{"h":"Natación infantil","b":"CURSOS DE NATACIÓN para niños de 4 a 10 años. Grupos según la edad y el nivel. Dos días por semana, lunes y miércoles o martes y jueves, de 17:30 a 18:15. El primer día, los niños hacen una prueba para conocer su nivel. Los padres no pueden entrar en la zona de la piscina. El precio es de 35 euros al mes. Inscripciones en la recepción del polideportivo."},{"h":"Reparación de móviles","b":"MÓVIL EXPRESS. Reparamos tu teléfono en una hora: pantallas, baterías y cámaras. Presupuesto gratis y sin compromiso. Todas nuestras reparaciones tienen garantía de seis meses. Si no podemos arreglarlo, no pagas nada. Abierto también los sábados por la mañana. Estamos en la calle Real, 45, al lado del mercado. También vendemos fundas y cargadores."},{"h":"Objetos perdidos","b":"AEROPUERTO. Si ha perdido algún objeto, diríjase a la oficina de objetos perdidos, en la planta 0 de la Terminal 2. Puede llamar por teléfono, pero no se dan informaciones por correo electrónico. Los objetos se guardan durante tres meses. Para recogerlos, es necesario un documento de identidad. La oficina abre todos los días de 6:00 a 23:00. El teléfono es el 913 000 000."},{"h":"Reciclaje","b":"NUEVO HORARIO DE RECOGIDA. A partir del 1 de abril, los vecinos deben dejar la basura en los contenedores entre las 20:00 y las 23:00. El papel va en el contenedor azul, los envases en el amarillo y el vidrio en el verde. Los muebles viejos se recogen gratis llamando al 010. Si tiene dudas, consulte la web del Ayuntamiento o llame al 010. ¡Gracias por cuidar nuestro barrio!"},{"h":"Panadería","b":"PANADERÍA LA ESPIGA. Pan recién hecho todos los días desde las 7:00. Todos nuestros productos se hacen con harina ecológica. Los domingos, roscón y bizcochos caseros por encargo: haz tu pedido antes del viernes. Cerramos los lunes por descanso del personal. Estamos en la plaza de San Juan, 2. También tenemos café para llevar."}],"items":[{"x":0,"q":"Para empadronarse en San Roque…","o":["no hace falta pedir cita.","hay que llevar el contrato de la casa.","se puede ir cualquier día de agosto."],"a":1,"w":"Hay que traer «el contrato de alquiler o las escrituras de la vivienda». Se necesita cita y en agosto solo abren martes y jueves."},{"x":1,"q":"En el mercadillo…","o":["se venden cosas usadas.","se puede vender comida.","hay que pagar siempre por el puesto."],"a":0,"w":"Es un «mercadillo de segunda mano» de ropa, libros, juguetes y muebles. El puesto es gratis para los vecinos."},{"x":2,"q":"En el Teatro Principal…","o":["la obra es solo para adultos.","los miércoles es más barato.","solo se venden entradas en taquilla."],"a":1,"w":"«Los miércoles, día del espectador: todas las entradas a 8 euros»."},{"x":3,"q":"En los cursos de natación…","o":["todos los niños están en el mismo grupo.","los padres pueden ver la clase desde la piscina.","los niños hacen una prueba al principio."],"a":2,"w":"«El primer día, los niños hacen una prueba para conocer su nivel»."},{"x":4,"q":"En Móvil Express…","o":["hay que pagar por el presupuesto.","no cobran si no pueden reparar el móvil.","no abren los fines de semana."],"a":1,"w":"«Si no podemos arreglarlo, no pagas nada». El presupuesto es gratis y abren los sábados."},{"x":5,"q":"En la oficina de objetos perdidos…","o":["puedes preguntar por correo electrónico.","guardan los objetos un año.","tienes que identificarte para recoger algo."],"a":2,"w":"«Para recogerlos, es necesario un documento de identidad». Por correo no informan y los guardan tres meses."},{"x":6,"q":"Con el nuevo horario de recogida…","o":["el vidrio va en el contenedor azul.","hay que sacar la basura por la noche.","recoger muebles cuesta dinero."],"a":1,"w":"La basura se deja «entre las 20:00 y las 23:00». El vidrio va en el verde y los muebles se recogen gratis."},{"x":7,"q":"En la panadería La Espiga…","o":["abren todos los días de la semana.","para el domingo hay que encargar los dulces.","el pan está listo a las nueve."],"a":1,"w":"El roscón y los bizcochos del domingo son «por encargo: haz tu pedido antes del viernes». Cierran los lunes."}]},{"t":3,"texts":[{"h":"A. Curso de fotografía","b":"¿Quieres aprender a hacer fotos bonitas con tu móvil? En este curso de cuatro semanas te enseñamos a usar la luz, a elegir el mejor momento y a editar tus fotos con aplicaciones gratuitas. Las clases son los sábados por la mañana y se hacen al aire libre, en diferentes barrios de la ciudad. No necesitas una cámara profesional: solo tu teléfono. Precio: 60 euros. Plazas limitadas a doce personas. El profesor es un fotógrafo profesional que trabaja para varias revistas de viajes. Al final del curso hacemos una pequeña exposición con las mejores fotos de los alumnos en una cafetería del centro."},{"h":"B. Taller de guitarra","b":"El centro cultural del barrio ofrece un taller de guitarra española para adultos sin conocimientos de música. Durante tres meses aprenderás a tocar canciones populares y algo de flamenco. Las clases son los lunes y miércoles de 19:00 a 20:30. Si no tienes guitarra, el centro te presta una durante el curso. El taller es gratuito para personas jubiladas y desempleadas; para los demás cuesta 30 euros al mes. Las clases las da un guitarrista que ha tocado en muchos conciertos por toda Andalucía. Al terminar el taller, los alumnos tocan juntos en la fiesta del barrio, en junio."},{"h":"C. Club de lectura","b":"La biblioteca de Las Arenas organiza un club de lectura en inglés para practicar el idioma. Cada mes leemos un libro y el último jueves nos reunimos para comentarlo con una profesora nativa. Es necesario tener un nivel intermedio. La biblioteca presta los libros a los participantes, así que no tienes que comprarlos. La actividad es gratuita, pero hay que inscribirse en la biblioteca. Este año vamos a leer novelas cortas y algunos cuentos de autores famosos. Las reuniones duran una hora y media y después tomamos un café juntos en la sala de la biblioteca."}],"items":[{"q":"Esta actividad sirve también para aprender un idioma.","a":2,"w":"El club de lectura es «en inglés para practicar el idioma»."},{"q":"Las clases no son en un edificio.","a":0,"w":"Las clases de fotografía «se hacen al aire libre, en diferentes barrios»."},{"q":"Es gratis solo para algunas personas.","a":1,"w":"El taller de guitarra es gratuito solo «para personas jubiladas y desempleadas»; los demás pagan 30 euros al mes. El club de lectura es gratis para todos."},{"q":"Si no tienes instrumento, te lo dejan.","a":1,"w":"En el taller de guitarra, «si no tienes guitarra, el centro te presta una»."},{"q":"Es necesario tener cierto nivel antes de empezar.","a":2,"w":"En el club de lectura «es necesario tener un nivel intermedio». La guitarra es para personas sin conocimientos."},{"q":"Hay un número máximo de alumnos.","a":0,"w":"En el curso de fotografía las «plazas [están] limitadas a doce personas»."}]},{"t":4,"texts":[{"h":"Guía de viaje: un fin de semana en Cuenca","b":"Cuenca es una de esas ciudades que sorprenden al visitante. Está a solo dos horas de Madrid en coche, y a menos de una hora en tren de alta velocidad, pero muchos turistas todavía no la conocen. Su casco antiguo, construido sobre una montaña entre dos ríos, el Júcar y el Huécar, es Patrimonio de la Humanidad desde 1996.\n\nEl símbolo de la ciudad son las famosas Casas Colgadas. Son casas del siglo XV construidas al borde de la roca, con balcones de madera que parecen flotar en el aire. Hoy en una de ellas está el Museo de Arte Abstracto Español, que tiene una colección muy interesante de pintores de los años cincuenta y sesenta. La entrada es gratuita, pero suele haber cola los sábados, así que es mejor ir temprano.\n\nPara tener la mejor vista de las casas, hay que cruzar el puente de San Pablo, un puente de hierro y madera de cien metros de largo. Si tienes miedo a las alturas, quizás no es buena idea: está a sesenta metros sobre el río. Desde allí también se puede bajar a pie hasta el parador, un antiguo convento convertido en hotel.\n\nDespués del paseo, es el momento de probar la gastronomía local. El plato más típico es el morteruelo, una especie de paté caliente que se come con pan. También son famosos el ajoarriero y, de postre, el alajú, un dulce de miel y almendras de origen árabe. La mayoría de los restaurantes están en la Plaza Mayor, al lado de la catedral, que es una de las primeras catedrales góticas de España.\n\nSi tienes más tiempo, merece la pena salir de la ciudad. A media hora en coche está la Ciudad Encantada, un parque natural con rocas de formas extrañas: una parece un barco, otra una cara humana… El recorrido dura una hora y media y es fácil, también para niños. Ojo: en invierno cierra a las seis de la tarde.\n\nLa mejor época para visitar Cuenca es la primavera o el otoño, cuando las temperaturas son agradables. En Semana Santa la ciudad se llena de gente por sus famosas procesiones y la música religiosa, así que, si quieres ir en esas fechas, tienes que reservar el hotel con meses de antelación."}],"items":[{"q":"Según el texto, Cuenca…","o":["está muy lejos de Madrid.","no es todavía muy conocida.","tiene un río que cruza el casco antiguo."],"a":1,"w":"«Muchos turistas todavía no la conocen». El casco antiguo está entre dos ríos, no cruzado por uno."},{"q":"En el Museo de Arte Abstracto…","o":["hay que pagar entrada.","hay pinturas del siglo XV.","puede haber mucha gente los sábados."],"a":2,"w":"«Suele haber cola los sábados». La entrada es gratuita y las obras son de los años cincuenta y sesenta."},{"q":"El puente de San Pablo…","o":["no es recomendable para todo el mundo.","es de piedra.","lleva directamente a la catedral."],"a":0,"w":"Está a sesenta metros sobre el río: «si tienes miedo a las alturas, quizás no es buena idea»."},{"q":"El alajú es…","o":["un plato caliente.","un dulce.","un tipo de pan."],"a":1,"w":"Es «un dulce de miel y almendras de origen árabe». El morteruelo es el paté caliente."},{"q":"La visita a la Ciudad Encantada…","o":["es difícil para los niños.","está en el centro de Cuenca.","tiene un horario más corto en invierno."],"a":2,"w":"«En invierno cierra a las seis de la tarde». Está a media hora en coche y el recorrido es fácil."},{"q":"Si quieres ir a Cuenca en Semana Santa…","o":["es mejor reservar con mucho tiempo.","vas a encontrar poca gente.","hace demasiado calor."],"a":0,"w":"La ciudad se llena de gente, así que hay que «reservar el hotel con meses de antelación»."}]}]},{"id":"R4","title":"Familia y casa","tasks":[{"t":1,"texts":[{"h":"Correo de Ana a su hermano Luis","b":"Asunto: La fiesta de mamá\n\nHola, Luis:\n\nTe escribo por la fiesta sorpresa de mamá. Como sabes, el 22 de mayo cumple setenta años y papá quiere hacer algo especial. Ayer hablé con él y hemos decidido celebrarlo el sábado 24, porque el 22 es jueves y mucha gente trabaja.\n\nAl principio pensamos en hacer la fiesta en casa, pero somos casi cuarenta personas y no cabemos. Así que he reservado un salón en el restaurante El Olivo, el que está al lado del río. Tienen un menú de 35 euros por persona con entrantes, pescado o carne, postre y bebidas. Los niños menores de diez años pagan la mitad. Papá dice que él paga la comida, pero yo creo que es mejor dividirlo entre los tres hermanos. ¿Qué te parece?\n\nTengo un favor que pedirte. Tú tienes buena relación con la tía Isabel y con los primos de Bilbao. ¿Puedes llamarlos tú para invitarlos? Yo me encargo de los amigos de mamá del coro y de las vecinas. Raquel va a preparar un vídeo con fotos antiguas de la familia; si tienes fotos de cuando éramos pequeños, mándaselas antes del día 15.\n\nLo más difícil es que mamá no se entere. Papá le va a decir que van a comer los dos solos para celebrarlo, y cuando entren en el restaurante, ¡sorpresa! Por favor, no digas nada en el grupo familiar, porque mamá lo lee todo.\n\nAh, y para el regalo había pensado en un viaje a Lisboa para los dos, porque siempre ha querido ir. ¿Estás de acuerdo?\n\nLlámame esta semana y lo hablamos.\n\nBesos,\nAna"}],"items":[{"q":"La fiesta va a ser el sábado porque…","o":["es el día del cumpleaños.","el restaurante no tiene sitio otro día.","el jueves muchos invitados trabajan."],"a":2,"w":"El cumpleaños es el jueves 22, «y mucha gente trabaja», por eso lo celebran el sábado 24."},{"q":"No hacen la fiesta en casa porque…","o":["hay demasiados invitados.","es muy caro.","la madre no quiere."],"a":0,"w":"«Somos casi cuarenta personas y no cabemos»."},{"q":"Sobre el dinero de la comida, Ana piensa que…","o":["debe pagarlo el padre.","deben pagarlo los hermanos.","cada invitado debe pagar su menú."],"a":1,"w":"Ana cree que «es mejor dividirlo entre los tres hermanos»."},{"q":"Ana le pide a Luis que…","o":["prepare un vídeo.","llame a algunos familiares.","invite a las vecinas."],"a":1,"w":"Le pide que llame a la tía Isabel y a los primos de Bilbao. El vídeo lo prepara Raquel y las vecinas son cosa de Ana."},{"q":"Ana no quiere que Luis escriba en el grupo familiar porque…","o":["su madre puede leerlo.","su padre no lo usa.","es muy pronto."],"a":0,"w":"«No digas nada en el grupo familiar, porque mamá lo lee todo»."}]},{"t":2,"texts":[{"h":"Peluquería","b":"PELUQUERÍA ESTILO. Esta semana, corte de pelo para hombre: 10 euros. Mujeres: lavado, corte y peinado por 25 euros. Los jueves, 20 % de descuento para estudiantes con carné. Atendemos sin cita de lunes a viernes; los sábados, solo con cita previa. Estamos en la calle Luna, 7. También vendemos productos para el cuidado del pelo."},{"h":"Autobús nocturno","b":"EMPRESA MUNICIPAL DE TRANSPORTES. Desde el 1 de junio, los autobuses nocturnos (líneas N1 a N6) funcionarán todos los días, no solo los fines de semana. Salen cada 30 minutos desde la plaza de España entre las 0:00 y las 5:30. El precio del billete es el mismo que de día. Puede consultar los recorridos en la web o en las paradas."},{"h":"Clases de baile","b":"ESCUELA RITMO. Aprende a bailar salsa, bachata y tango. Clases para adultos de todas las edades, en pareja o solos. Grupos de nivel inicial los martes y avanzado los jueves. La primera clase es de prueba y gratuita. Después, 40 euros al mes por una clase semanal. Estamos en la calle del Prado, 22, segundo piso. Las clases duran una hora."},{"h":"Vuelos","b":"¡VUELA AHORA! Billetes a las islas Canarias desde 49 euros, ida y vuelta, para viajar entre octubre y diciembre. Oferta válida solo para compras hechas en nuestra web antes del domingo. El precio incluye una maleta pequeña de cabina. La maleta grande tiene un coste adicional. Plazas limitadas. Los vuelos salen desde Madrid, Barcelona y Bilbao."},{"h":"Centro de salud","b":"CENTRO DE SALUD NORTE. Campaña de vacunación de la gripe para mayores de 60 años y personas con enfermedades crónicas. Del 15 de octubre al 30 de noviembre. Es necesario pedir cita por teléfono o en la aplicación. Recuerde traer su tarjeta sanitaria. El centro abre de lunes a viernes de 8:00 a 20:00. La vacuna es gratuita."},{"h":"Tienda de muebles","b":"MUEBLES CASA BONITA cierra este establecimiento. ¡Todo con un 50 % de descuento! Sofás, mesas, camas y armarios. El transporte a domicilio es gratis en la ciudad, pero el montaje no está incluido. No se admiten devoluciones. Hasta fin de existencias. Visite nuestra tienda en el polígono industrial, abierta de lunes a sábado."},{"h":"Zoológico","b":"ZOO AVENTURA. Nuevo horario de invierno: de 10:30 a 17:30. Los niños menores de 3 años entran gratis. Con la entrada familiar (dos adultos y dos niños) ahorras un 25 %. Se pueden llevar bocadillos, pero no se puede dar comida a los animales. Este invierno puedes ver a los nuevos osos panda en el pabellón de Asia."},{"h":"Taller de bicicletas","b":"TALLER RUEDAS. ¿Tu bicicleta necesita una revisión? Ven a nuestro taller gratuito los sábados por la mañana y aprende a cambiar una rueda, arreglar los frenos o ajustar la cadena. Nosotros ponemos las herramientas. Imprescindible traer tu propia bicicleta. El taller está en el patio del centro cívico. Plazas para quince personas."}],"items":[{"x":0,"q":"En la Peluquería Estilo…","o":["los estudiantes tienen descuento todos los días.","no es necesario pedir cita entre semana.","el corte para hombre cuesta 25 euros."],"a":1,"w":"«Atendemos sin cita de lunes a viernes». El descuento es solo los jueves y el corte de hombre cuesta 10 euros."},{"x":1,"q":"Desde junio, los autobuses nocturnos…","o":["funcionan solo los fines de semana.","son más caros.","funcionan todos los días."],"a":2,"w":"«Funcionarán todos los días, no solo los fines de semana». El precio es el mismo."},{"x":2,"q":"En la Escuela Ritmo…","o":["se puede ir sin pareja.","solo hay clases para jóvenes.","la primera clase cuesta 40 euros."],"a":0,"w":"Las clases son «en pareja o solos». Son para todas las edades y la primera es gratuita."},{"x":3,"q":"La oferta de vuelos…","o":["es para viajar en verano.","incluye una maleta grande.","solo es válida comprando por internet."],"a":2,"w":"«Oferta válida solo para compras hechas en nuestra web». Es para octubre a diciembre y solo incluye maleta de cabina."},{"x":4,"q":"Para vacunarse de la gripe…","o":["hay que pedir una cita.","basta con ir al centro de salud.","hay que ser menor de 60 años."],"a":0,"w":"«Es necesario pedir cita por teléfono o en la aplicación»."},{"x":5,"q":"En Muebles Casa Bonita…","o":["montan los muebles gratis.","se pueden devolver los muebles.","te llevan los muebles a casa sin pagar."],"a":2,"w":"«El transporte a domicilio es gratis en la ciudad». El montaje no está incluido y no hay devoluciones."},{"x":6,"q":"En el Zoo Aventura…","o":["se puede llevar comida para los visitantes.","se puede alimentar a los animales.","los niños no pagan entrada."],"a":0,"w":"«Se pueden llevar bocadillos, pero no se puede dar comida a los animales». Solo los menores de 3 años entran gratis."},{"x":7,"q":"En el taller de bicicletas…","o":["hay que pagar las herramientas.","enseñan a reparar la bicicleta.","alquilan bicicletas los sábados."],"a":1,"w":"Es un taller para aprender «a cambiar una rueda, arreglar los frenos o ajustar la cadena»."}]},{"t":3,"texts":[{"h":"A. Piso en el centro","b":"Alquilo piso de 60 metros en pleno centro, a cinco minutos de la estación de metro. Tiene un dormitorio, salón, cocina americana y un baño completo. Está totalmente amueblado y tiene calefacción y aire acondicionado. El edificio es antiguo, pero tiene ascensor. Precio: 850 euros al mes. Es necesario pagar dos meses de fianza. Ideal para una persona o una pareja sin hijos. No se aceptan mascotas. El piso está en una tercera planta y es exterior, con dos balcones a una calle con muchas tiendas y restaurantes. La cocina tiene lavavajillas y lavadora. Disponible a partir del 1 de septiembre."},{"h":"B. Casa con jardín","b":"Se alquila casa de dos plantas en una urbanización tranquila, a 20 kilómetros de la ciudad. Tiene cuatro dormitorios, dos baños, garaje para dos coches y un jardín grande con piscina compartida con los vecinos. No está amueblada. Hay un colegio y un supermercado a diez minutos a pie. Perfecta para familias. Se aceptan animales. Precio: 1.100 euros al mes, gastos de comunidad incluidos. La casa es muy luminosa y tiene una cocina grande con salida directa al jardín. En la urbanización hay también pistas de tenis. Para ir a la ciudad hace falta coche, porque el autobús pasa solo cada hora."},{"h":"C. Estudio para estudiantes","b":"Estudio de 30 metros cerca de la universidad, con cama, escritorio y una pequeña cocina. Está en un quinto piso sin ascensor, pero es muy luminoso y tiene una terraza con vistas a la ciudad. El precio, 500 euros al mes, incluye internet, agua y electricidad. Solo se alquila de septiembre a junio, durante el curso académico. Se pide una carta de la universidad. El edificio es tranquilo y en la planta baja hay una cafetería con menús baratos para estudiantes. La universidad está a diez minutos a pie. Se pide un mes de fianza al firmar el contrato."}],"items":[{"q":"Puedes vivir aquí con tu perro.","a":1,"w":"En la casa con jardín «se aceptan animales». El piso del centro no acepta mascotas."},{"q":"Tienes que subir las escaleras a pie.","a":2,"w":"El estudio está «en un quinto piso sin ascensor»."},{"q":"No tienes que pagar aparte las facturas de la luz.","a":2,"w":"El precio del estudio «incluye internet, agua y electricidad»."},{"q":"Tienes que comprar los muebles.","a":1,"w":"La casa con jardín «no está amueblada». El piso del centro está totalmente amueblado."},{"q":"No se puede alquilar todo el año.","a":2,"w":"El estudio «solo se alquila de septiembre a junio»."},{"q":"Está muy bien comunicado con el transporte público.","a":0,"w":"El piso está «a cinco minutos de la estación de metro»."}]},{"t":4,"texts":[{"h":"La bicicleta azul","b":"Cuando Marina cumplió nueve años, su abuelo Ramón le regaló una bicicleta azul. No era nueva: la había encontrado en un mercadillo y la había arreglado él mismo durante semanas en el garaje. Le había cambiado las ruedas, había pintado el cuadro y había puesto una cesta delante y un timbre plateado que sonaba muy fuerte. A Marina le pareció la bicicleta más bonita del mundo.\n\nEse verano, cada tarde, cuando bajaba el calor, el abuelo y la nieta salían juntos a pasear por los caminos del pueblo. Él iba en su vieja bicicleta negra y ella, detrás, tocando el timbre cada vez que veía un gato o una vaca. A veces llegaban hasta el río y se sentaban a comer fruta debajo de un árbol. El abuelo le contaba historias de cuando era joven y trabajaba de cartero en esa misma bicicleta negra.\n\nPasaron los años. Marina se fue a estudiar a Barcelona y después encontró trabajo como ingeniera en Alemania. Volvía al pueblo solo en Navidad y algunas semanas en verano. La bicicleta azul se quedó en el garaje, cubierta de polvo, al lado de la negra del abuelo, que ya no podía montar porque le dolían las rodillas.\n\nCuando el abuelo murió, Marina tenía treinta y dos años. Volvió al pueblo para el entierro y, unos días después, su abuela le dio un sobre. Dentro había una carta del abuelo y una llave pequeña. En la carta, con su letra grande y un poco temblorosa, Ramón le pedía una cosa: «No dejes que las bicicletas se mueran en el garaje».\n\nMarina no supo qué hacer con esas palabras durante meses. Pero un día, en Berlín, vio a un grupo de jóvenes que arreglaban bicicletas viejas en un taller del barrio para regalarlas a niños sin recursos. Esa misma tarde entró a preguntar si necesitaban ayuda.\n\nHoy, cinco años después, Marina ha vuelto a vivir en el pueblo. Trabaja para su empresa desde casa y, los fines de semana, abre el antiguo garaje del abuelo, que ahora es un pequeño taller. Allí enseña a los niños de la zona a reparar bicicletas. Ya han arreglado más de doscientas. La llave pequeña era la del candado de la bicicleta negra, que ahora está colgada en la pared del taller, al lado de una foto del abuelo. La bicicleta azul la usa su hija, que acaba de cumplir nueve años."}],"items":[{"q":"La bicicleta que el abuelo regaló a Marina…","o":["la compró nueva en una tienda.","la reparó él mismo.","era la bicicleta de cuando él era joven."],"a":1,"w":"La encontró en un mercadillo «y la había arreglado él mismo durante semanas». La bici de cuando era joven es la negra."},{"q":"Durante los paseos de aquel verano…","o":["el abuelo hablaba de su trabajo de joven.","Marina iba delante del abuelo.","salían por la mañana temprano."],"a":0,"w":"Le contaba historias de cuando trabajaba de cartero. Salían por la tarde y ella iba detrás."},{"q":"Cuando Marina vivía fuera del pueblo…","o":["usaba la bicicleta azul en verano.","el abuelo seguía montando en bicicleta.","las bicicletas estaban guardadas en el garaje."],"a":2,"w":"La bicicleta azul se quedó en el garaje, al lado de la negra; el abuelo ya no podía montar."},{"q":"En su carta, el abuelo le pide a Marina que…","o":["venda las bicicletas.","dé nueva vida a las bicicletas.","cuide de la abuela."],"a":1,"w":"«No dejes que las bicicletas se mueran en el garaje»: quería que se siguieran usando."},{"q":"En Berlín, Marina…","o":["abrió su propio taller.","empezó a colaborar con un grupo de jóvenes.","compró una bicicleta para su hija."],"a":1,"w":"Vio a unos jóvenes que arreglaban bicicletas para niños sin recursos y entró a preguntar si necesitaban ayuda."},{"q":"Al final de la historia sabemos que…","o":["Marina ha dejado su trabajo de ingeniera.","la llave abría el garaje.","la hija de Marina usa la bicicleta azul."],"a":2,"w":"«La bicicleta azul la usa su hija». Marina sigue trabajando desde casa y la llave era la del candado de la bici negra."}]}]},{"id":"R5","title":"Viajes y fiestas","tasks":[{"t":1,"texts":[{"h":"Correo de Diego a su amigo Hugo","b":"Asunto: El Camino de Santiago\n\n¡Hola, Hugo!\n\n¿Cómo va todo por Londres? Te escribo porque por fin tengo vacaciones en julio y quiero hacer el Camino de Santiago, como hablamos el año pasado. ¿Todavía te apetece venir?\n\nHe estado mirando información y creo que lo mejor es hacer el Camino Portugués desde Tui, en la frontera con Portugal. Son unos 120 kilómetros hasta Santiago y se hacen en seis días, caminando unos veinte kilómetros al día. No es muy difícil y el paisaje es precioso: bosques, ríos y pueblos pequeños. Además, con 100 kilómetros como mínimo ya te dan la Compostela, el certificado oficial.\n\nPara dormir, hay albergues públicos que cuestan entre 8 y 10 euros, pero no se pueden reservar y en verano se llenan pronto. Yo prefiero buscar pensiones o albergues privados: son un poco más caros, unos 20 euros, pero podemos reservar y tienen habitaciones para dos personas. ¿Qué opinas?\n\nLo más importante es el calzado. Mi hermana hizo el Camino el año pasado con botas nuevas y terminó con los pies destrozados. Así que, si vas a comprar botas, cómpralas ya y úsalas antes de venir. Y la mochila no debe pesar más de siete u ocho kilos.\n\nYo había pensado salir el lunes 7 de julio y llegar a Santiago el sábado 12. Así el domingo podemos ir a la misa del peregrino en la catedral y descansar antes de volver. Podemos volar los dos a Vigo; desde allí hay un tren a Tui.\n\nContéstame cuando puedas, ¡pero no tardes mucho, que hay que reservar!\n\nUn abrazo,\nDiego"}],"items":[{"q":"Diego escribe a Hugo para…","o":["invitarlo a hacer juntos un viaje.","contarle el viaje de su hermana.","pedirle que reserve los billetes de avión."],"a":0,"w":"Le pregunta si todavía le apetece hacer el Camino con él en julio y le explica el plan."},{"q":"Diego prefiere el Camino Portugués desde Tui porque…","o":["es el camino más largo.","no es demasiado difícil.","pasa por grandes ciudades."],"a":1,"w":"«No es muy difícil y el paisaje es precioso». Pasa por pueblos pequeños."},{"q":"Diego prefiere dormir en pensiones o albergues privados porque…","o":["son más baratos.","se pueden reservar.","están más cerca del Camino."],"a":1,"w":"Los públicos no se pueden reservar y se llenan; los privados son más caros, «pero podemos reservar»."},{"q":"Diego le aconseja a Hugo…","o":["comprar botas nuevas en Santiago.","llevar una mochila grande.","usar las botas antes del viaje."],"a":2,"w":"«Si vas a comprar botas, cómpralas ya y úsalas antes de venir»."},{"q":"Según el plan de Diego, el domingo 13 de julio…","o":["van a ir a la catedral.","van a empezar a caminar.","van a volar a Vigo."],"a":0,"w":"Llegan el sábado 12 y el domingo quieren ir a la misa del peregrino en la catedral."}]},{"t":2,"texts":[{"h":"Oficina de turismo","b":"OFICINA DE TURISMO. Visitas guiadas gratuitas por el casco histórico todos los días a las 11:00 y a las 17:00, en español e inglés. La visita dura dos horas y sale desde la puerta de la oficina. No es necesario reservar, excepto para grupos de más de diez personas. La oficina está en la plaza del Ayuntamiento y abre de 9:00 a 19:00. Allí puedes conseguir mapas de la ciudad."},{"h":"Festival de música","b":"FESTIVAL VERANO SONORO. Tres días de música en el puerto: 18, 19 y 20 de julio. Abono para los tres días: 75 euros; entrada de un día: 35 euros. Los menores de 16 años solo pueden entrar con un adulto. Habrá autobuses gratuitos desde el centro cada 20 minutos. Actuarán más de veinte grupos nacionales e internacionales. Entradas a la venta en la web del festival."},{"h":"Rebajas","b":"TIENDA MODA JOVEN. ¡Empiezan las rebajas! Hasta un 60 % de descuento en ropa y zapatos. Las prendas rebajadas se pueden cambiar durante 15 días con el tique de compra, pero no se devuelve el dinero. Este domingo abrimos de 11:00 a 20:00. Estamos en la calle Comercio, 12. Pagando con nuestra tarjeta de cliente, tienes un 5 % de descuento extra."},{"h":"Guardería","b":"ESCUELA INFANTIL PEQUES. Plazas libres para niños de 1 a 3 años. Horario de 7:30 a 17:00, con comedor y cocina propia. Ofrecemos clases de inglés y música. Jornada de puertas abiertas el sábado 10 de 10:00 a 13:00 para conocer el centro. Es necesario reservar hora. Estamos en la calle Pinar, 3, al lado del parque. Teléfono: 976 543 210."},{"h":"Autoescuela","b":"AUTOESCUELA VELOZ. Sácate el carné de conducir este verano. Curso intensivo de teoría en dos semanas, con clases por la mañana o por la tarde. Las clases prácticas se pagan aparte: 30 euros cada una. Si te matriculas antes del 30 de junio, te regalamos dos clases prácticas. Nuestros profesores tienen más de diez años de experiencia. Estamos en la avenida de Madrid, 30."},{"h":"Aparcamiento","b":"APARCAMIENTO PLAZA NUEVA. Abierto las 24 horas. Precio: 2 euros la hora; máximo 18 euros al día. Si compras en el centro comercial, la primera hora es gratis: enseña tu tique de compra en la caja. No se permite dejar el coche más de siete días. Hay plazas para personas con movilidad reducida en la planta -1. Se puede pagar con tarjeta o con el móvil."},{"h":"Curso en línea","b":"Aprende a usar tu ordenador con nuestro curso en línea para mayores de 60 años. Correo electrónico, videollamadas con la familia y compras seguras por internet. Diez lecciones en vídeo que puedes ver cuando quieras. Si tienes dudas, un profesor te llama por teléfono. Precio: 20 euros. Inscríbete en nuestra página web. Las lecciones son en español y con letra grande."},{"h":"Mercado navideño","b":"MERCADO DE NAVIDAD en la Plaza Mayor del 1 de diciembre al 6 de enero. Puestos de artesanía, adornos, dulces típicos y chocolate caliente. Todos los sábados a las 18:00 hay un concierto de villancicos. El día 5 de enero, a las 19:00, pasa por la plaza la cabalgata de los Reyes Magos. El mercado abre todos los días de 11:00 a 21:00. ¡Ven a vivir la Navidad con tu familia!"}],"items":[{"x":0,"q":"Para la visita guiada de la oficina de turismo…","o":["hay que pagar una entrada.","los grupos grandes deben reservar.","hay solo una visita al día."],"a":1,"w":"No hay que reservar «excepto para grupos de más de diez personas». Es gratuita y hay dos visitas al día."},{"x":1,"q":"En el festival Verano Sonoro…","o":["los niños pueden entrar solos.","hay transporte gratis desde el centro.","la entrada de un día cuesta 75 euros."],"a":1,"w":"«Habrá autobuses gratuitos desde el centro cada 20 minutos». El abono de tres días cuesta 75 euros."},{"x":2,"q":"En la tienda Moda Joven…","o":["se puede cambiar la ropa rebajada.","devuelven el dinero de las rebajas.","los domingos está cerrada."],"a":0,"w":"La ropa rebajada «se puede cambiar durante 15 días con el tique», pero no se devuelve el dinero."},{"x":3,"q":"En la Escuela Infantil Peques…","o":["los niños comen en el centro.","no hay plazas libres.","no hace falta cita para la jornada de puertas abiertas."],"a":0,"w":"Tienen «comedor y cocina propia». Hay plazas libres y para la jornada «es necesario reservar hora»."},{"x":4,"q":"En la Autoescuela Veloz…","o":["las clases prácticas están incluidas en el curso.","hay un regalo si te apuntas pronto.","el curso de teoría dura dos meses."],"a":1,"w":"Si te matriculas antes del 30 de junio, «te regalamos dos clases prácticas»."},{"x":5,"q":"En el aparcamiento Plaza Nue
