va…","o":["no se puede aparcar de noche.","puedes aparcar gratis una hora si compras en el centro comercial.","puedes dejar el coche un mes."],"a":1,"w":"«Si compras en el centro comercial, la primera hora es gratis». Abre 24 horas y el máximo son siete días."},{"x":6,"q":"El curso de ordenador…","o":["tiene clases a una hora fija.","es para personas de cualquier edad.","ofrece ayuda de un profesor por teléfono."],"a":2,"w":"«Si tienes dudas, un profesor te llama por teléfono». Las lecciones se ven cuando quieras y es para mayores de 60."},{"x":7,"q":"En el mercado de Navidad…","o":["hay música los sábados.","solo se venden dulces.","la cabalgata pasa el 6 de enero."],"a":0,"w":"«Todos los sábados a las 18:00 hay un concierto de villancicos». La cabalgata es el 5 de enero."}]},{"t":3,"texts":[{"h":"A. Restaurante El Puerto","b":"Restaurante especializado en pescado y marisco fresco, que llega cada mañana del puerto. Nuestra especialidad es la paella de marisco, que hay que pedir con un día de antelación. Tenemos una terraza con vistas al mar, abierta de mayo a octubre. De lunes a viernes ofrecemos un menú del día por 16 euros, con dos platos, postre y bebida. Cerramos los martes. Es recomendable reservar los fines de semana. El restaurante está en el paseo marítimo, al lado del faro, y tiene un pequeño comedor interior muy acogedor. Nuestro cocinero, Manuel, lleva treinta años preparando pescado."},{"h":"B. La Huerta Verde","b":"La Huerta Verde es un restaurante vegetariano en el barrio antiguo. Cocinamos con verduras de nuestro propio huerto, a cinco kilómetros de la ciudad. Todos los platos se pueden preparar sin gluten. Los niños tienen un menú especial con un regalo. Por la tarde, de cinco a ocho, el restaurante funciona como cafetería con tartas caseras. No se aceptan reservas: hay que esperar mesa. El local es pequeño, solo tiene doce mesas, y está decorado con plantas y muebles antiguos. Cada semana cambiamos la carta según las verduras de temporada. También vendemos verduras del huerto los sábados."},{"h":"C. Asador Los Pinos","b":"El Asador Los Pinos está en el monte, a veinte minutos de la ciudad en coche, en una antigua casa de campo. Preparamos carne a la brasa y cordero asado en horno de leña. Tenemos un gran jardín con juegos para niños y un aparcamiento gratuito. Es un lugar muy popular para celebraciones como bodas y comuniones: tenemos un salón para doscientas personas. Abierto solo los fines de semana y festivos. La carne viene de granjas de la zona y el pan se hace cada día en el mismo horno. En invierno, el comedor principal tiene una gran chimenea. Las raciones son muy generosas."}],"items":[{"q":"Hay un plato que debes encargar antes.","a":0,"w":"La paella de marisco «hay que pedir[la] con un día de antelación»."},{"q":"No puedes reservar mesa.","a":1,"w":"En La Huerta Verde «no se aceptan reservas: hay que esperar mesa»."},{"q":"Está fuera de la ciudad.","a":2,"w":"El asador «está en el monte, a veinte minutos de la ciudad en coche»."},{"q":"Ofrece un menú barato entre semana.","a":0,"w":"El Puerto tiene «de lunes a viernes… un menú del día por 16 euros». El asador solo abre los fines de semana."},{"q":"Puedes hacer allí una fiesta con muchos invitados.","a":2,"w":"El asador tiene «un salón para doscientas personas» para celebraciones."},{"q":"Por la tarde puedes tomar algo dulce.","a":1,"w":"De cinco a ocho funciona «como cafetería con tartas caseras»."}]},{"t":4,"texts":[{"h":"Noticia: Villaverde del Río celebra su fiesta más original","b":"Este fin de semana, el pequeño pueblo de Villaverde del Río, en la provincia de Zaragoza, celebró por vigésimo año consecutivo su famosa Fiesta del Paraguas. Más de seis mil personas, la mayoría visitantes de otras regiones e incluso de otros países, llenaron las calles de un pueblo que normalmente tiene solo novecientos habitantes.\n\nLa fiesta nació en 2005 casi por casualidad. Ese año, el verano fue tan seco que los agricultores del pueblo perdieron gran parte de la cosecha. Un grupo de jóvenes decidió organizar una fiesta divertida para «llamar a la lluvia»: salieron a la calle con paraguas de colores, cantando y bailando como si estuviera lloviendo. Esa misma noche, según cuentan los vecinos mayores, llovió durante tres horas. Desde entonces, la fiesta se celebra cada año el último sábado de agosto.\n\nEl programa empieza por la mañana con un concurso de paraguas decorados. Este año participaron más de cien personas y ganó una niña de once años, Alba Pérez, con un paraguas que parecía un enorme girasol. A mediodía se sirve una comida popular en la plaza: los vecinos preparan migas, un plato típico de pan, ajo y chorizo, para todos los asistentes. Cuesta solo cinco euros y el dinero se usa para mejorar las instalaciones del pueblo.\n\nPero el momento más esperado llega a las ocho de la tarde. Los bomberos de la comarca colocan grandes mangueras en los balcones de la calle Mayor y, durante media hora, «hace llover» sobre la gente, que baila con sus paraguas abiertos al ritmo de una orquesta. «Es mi tercer año aquí. Vengo desde Valencia con mis amigos y siempre termino completamente mojado, pero es la fiesta más divertida del verano», explicaba Marcos, un estudiante de veintitrés años.\n\nNo todo el mundo está contento, sin embargo. Algunos vecinos se quejan del ruido y de la basura que dejan los visitantes, y otros critican que se use tanta agua en una zona donde llueve poco. Por eso, el Ayuntamiento ha decidido que desde el año que viene el agua de la fiesta será agua reciclada de la depuradora del pueblo. Además, ha anunciado que pondrá más papeleras y autobuses especiales desde Zaragoza para evitar los problemas de tráfico.\n\nLa alcaldesa, Rosa Gimeno, está muy orgullosa: «Hace veinte años nadie conocía Villaverde. Hoy tenemos dos casas rurales nuevas, un restaurante y jóvenes que han decidido quedarse a vivir aquí»."}],"items":[{"q":"Durante la fiesta, en el pueblo…","o":["hay más visitantes que vecinos.","solo hay gente del pueblo.","viven seis mil personas."],"a":0,"w":"Llegaron más de seis mil personas a un pueblo de solo novecientos habitantes."},{"q":"La fiesta empezó porque…","o":["había llovido demasiado.","no llovía y la cosecha se perdió.","un grupo de jóvenes quería vender paraguas."],"a":1,"w":"El verano de 2005 fue tan seco que los agricultores perdieron la cosecha, y los jóvenes organizaron la fiesta para «llamar a la lluvia»."},{"q":"La ganadora del concurso de paraguas…","o":["es una niña del pueblo.","hizo un paraguas en forma de flor.","tiene veintitrés años."],"a":1,"w":"Su paraguas «parecía un enorme girasol». El texto no dice que sea del pueblo; Marcos es quien tiene veintitrés años."},{"q":"El dinero de la comida popular sirve para…","o":["pagar a la orquesta.","ayudar a los agricultores.","mejorar el pueblo."],"a":2,"w":"«El dinero se usa para mejorar las instalaciones del pueblo»."},{"q":"Algunos vecinos critican la fiesta porque…","o":["se gasta mucha agua.","es demasiado cara.","dura muy poco."],"a":0,"w":"Critican «que se use tanta agua en una zona donde llueve poco», además del ruido y la basura."},{"q":"Según la alcaldesa, gracias a la fiesta…","o":["el pueblo tiene más habitantes que antes.","hay nuevos negocios en el pueblo.","el pueblo tiene una nueva depuradora."],"a":1,"w":"Hoy hay «dos casas rurales nuevas, un restaurante» y jóvenes que se quedan. No dice que haya más habitantes en total."}]}]}];
const LIST = [{"id":"L1","title":"De compras y por la ciudad","tasks":[{"t":1,"items":[{"s":[["M","Buenos días. Quería un billete para Valencia, para el tren de las diez y cuarto."],["H","Lo siento, señora, ese tren está completo. Hay otro a las once y media."],["M","¿Y llega muy tarde?"],["H","No, llega a las dos menos cuarto. ¿Ida y vuelta?"],["M","No, solo ida. Vuelvo en coche con mi hijo. Entonces, el de las once y media."],["H","Muy bien. Son treinta y dos euros. ¿Paga con tarjeta?"],["M","Sí, con tarjeta, gracias."]],"q":"¿A qué hora sale el tren que compra la mujer?","o":["A las 10:15.","A las 11:30.","A las 13:45."],"a":1,"w":"El tren de las diez y cuarto está completo; compra el de «las once y media». Las 13:45 es la hora de llegada."},{"s":[["H","Hola, buenas tardes. ¿Qué te pongo?"],["M","Un café con leche y… ¿tenéis zumo de naranja natural?"],["H","Sí, claro. ¿Grande o pequeño?"],["M","Pequeño. Ah, y en lugar del café con leche, mejor un té, que ya he tomado dos cafés hoy."],["H","Perfecto, un té y un zumo pequeño."],["H","Ahora mismo se lo llevo a la mesa. ¿Algo para comer?"],["M","No, gracias, solo eso."]],"q":"¿Qué va a tomar la mujer?","o":["Un café con leche y un zumo.","Un té y un zumo.","Dos cafés."],"a":1,"w":"Cambia el café por un té: «en lugar del café con leche, mejor un té»."},{"s":[["M","Perdona, ¿sabes dónde está la farmacia más cercana?"],["H","Sí, mira, sigue todo recto por esta calle hasta el semáforo. Allí giras a la izquierda y la farmacia está al lado de un banco."],["M","¿A la izquierda, en el semáforo?"],["H","Eso es. Está enfrente de la iglesia. Son cinco minutos andando."],["M","Muchas gracias, eres muy amable."],["H","De nada. ¡Que te mejores!"]],"q":"¿Dónde está la farmacia?","o":["Al lado de un banco.","Al lado de la iglesia.","En el semáforo."],"a":0,"w":"«La farmacia está al lado de un banco», enfrente de la iglesia."},{"s":[["H","¿Qué te parece esta camiseta para el cumpleaños de Pedro?"],["M","Es bonita, pero Pedro nunca lleva camisetas con dibujos. Mejor una lisa."],["H","¿Y esta azul?"],["M","Ya tiene muchas azules. ¿Por qué no le compramos un libro? Le encanta leer."],["H","Tienes razón. Vamos a la librería de enfrente."],["M","Y luego podemos tomar algo en la cafetería de al lado."]],"q":"¿Qué van a comprar para Pedro?","o":["Una camiseta con dibujos.","Una camiseta azul.","Un libro."],"a":2,"w":"Al final deciden: «¿Por qué no le compramos un libro?… Vamos a la librería»."},{"s":[["M","Buenas noches. Tenemos una reserva a nombre de García, para cuatro personas."],["H","A ver… García, sí. Pero aquí pone que es para las nueve y media, y son las nueve."],["M","Sí, perdone, hemos llegado pronto. ¿Podemos esperar en la barra?"],["H","Claro. Si quieren, les pongo algo de beber mientras tanto."],["M","Sí, por favor, dos cervezas y dos refrescos."]],"q":"¿Qué van a hacer las personas?","o":["Cenar en otro restaurante.","Esperar tomando algo.","Sentarse en la mesa inmediatamente."],"a":1,"w":"Han llegado media hora antes y preguntan si pueden esperar en la barra; el camarero les ofrece algo de beber."},{"s":[["H","Disculpe, mi maleta no ha salido. Vengo en el vuelo de Londres."],["M","¿Cómo es la maleta?"],["H","Es grande, de color rojo, con ruedas. Tiene una etiqueta con mi nombre."],["M","Rellene este formulario, por favor. Normalmente llegan en el siguiente vuelo y se la llevamos a su hotel mañana."],["H","Muy bien. ¿Tengo que pagar algo?"],["M","No, señor, el servicio es gratuito."]],"q":"¿Qué le pasa al hombre?","o":["Ha perdido el avión.","No encuentra su maleta.","Su hotel está cerrado."],"a":1,"w":"«Mi maleta no ha salido»: está en la oficina de equipajes del aeropuerto."}]},{"t":2,"items":[{"s":[["N","Radio Ciudad informa: este fin de semana se celebra en el parque central la Feria del Libro. Habrá más de cincuenta casetas de librerías y editoriales, y cada día a las seis de la tarde varios escritores firmarán sus libros. La entrada es libre."]],"q":"En la Feria del Libro…","o":["hay que pagar entrada.","se puede conocer a escritores.","hay actividades solo por la mañana."],"a":1,"w":"«Varios escritores firmarán sus libros» cada tarde. La entrada es libre."},{"s":[["N","Atención, información de tráfico. Debido a las obras en la calle Mayor, desde mañana y durante dos semanas los autobuses de las líneas 3 y 7 cambian su recorrido. Las paradas provisionales están señalizadas en la avenida de la Paz. Disculpen las molestias."]],"q":"Durante las obras…","o":["los autobuses no funcionan.","algunas líneas tienen paradas diferentes.","la avenida de la Paz está cerrada."],"a":1,"w":"Las líneas 3 y 7 cambian su recorrido y tienen «paradas provisionales» en la avenida de la Paz."},{"s":[["N","El tiempo para mañana: en el norte del país, cielos nubosos y lluvias por la mañana. En el centro y en el sur, sol y temperaturas altas, de hasta treinta y cinco grados. En la costa mediterránea habrá viento fuerte por la tarde."]],"q":"Según el pronóstico, mañana en el sur…","o":["va a llover.","va a hacer calor.","va a hacer mucho viento."],"a":1,"w":"En el centro y el sur habrá «sol y temperaturas altas, de hasta treinta y cinco grados». El viento es en la costa mediterránea."},{"s":[["N","¿Quieres aprender a nadar este verano? El polideportivo municipal abre las inscripciones para los cursos de julio. Hay grupos para niños y para adultos, por la mañana y por la tarde. Las plazas son limitadas, así que inscríbete pronto en la recepción o en la página web. El precio del curso es de cuarenta euros al mes."]],"q":"Para los cursos de natación…","o":["solo hay grupos de niños.","conviene inscribirse rápido.","solo puedes apuntarte por internet."],"a":1,"w":"«Las plazas son limitadas, así que inscríbete pronto». Hay grupos de adultos y también se puede ir a recepción."},{"s":[["N","Supermercados Frescos les recuerda que este jueves, día de fiesta local, nuestras tiendas estarán cerradas. El viernes abriremos con el horario normal, de nueve de la mañana a nueve y media de la noche. Gracias por confiar en nosotros. Pueden consultar nuestras ofertas en la página web."]],"q":"El jueves los supermercados…","o":["abren hasta las nueve y media.","no abren.","abren solo por la mañana."],"a":1,"w":"«Este jueves, día de fiesta local, nuestras tiendas estarán cerradas»."},{"s":[["N","Y ahora, una noticia curiosa: un grupo de estudiantes de Granada ha creado una aplicación para compartir comida que sobra en restaurantes y panaderías. Los usuarios pueden comprarla a mitad de precio antes de que cierren las tiendas. Ya la usan más de diez mil personas."]],"q":"La aplicación de los estudiantes sirve para…","o":["comprar comida más barata.","reservar mesa en restaurantes.","aprender a cocinar."],"a":0,"w":"Permite comprar la comida que sobra «a mitad de precio»."}]},{"t":3,"names":{"H":"Andrés","M":"Julia"},"s":[["M","¡Andrés! ¡Qué sorpresa! ¿Qué haces por aquí?"],["H","Hola, Julia. Vengo de una entrevista de trabajo en la oficina de enfrente."],["M","¿Ah, sí? ¿Y qué tal ha ido?"],["H","Creo que bien. Es para una empresa de informática. El problema es que está muy lejos de mi casa: tardo casi una hora en llegar en metro."],["M","Bueno, pero puedes leer en el metro. Yo antes tardaba cuarenta minutos en llegar al trabajo y leía un libro a la semana. Ahora trabajo desde casa y casi no leo."],["H","¿Trabajas desde casa? ¡Qué suerte!"],["M","No creas. Echo de menos a mis compañeros. Y a veces trabajo más horas que antes, porque no sé cuándo parar."],["H","Ya, lo entiendo. Oye, ¿sigues haciendo teatro?"],["M","Sí, los martes por la noche. Este año preparamos una comedia para diciembre. ¿Por qué no vienes a vernos?"],["H","Me encantaría. Yo dejé el grupo de música el año pasado, porque no tenía tiempo, pero ahora quiero apuntarme a clases de baile."],["M","¿De baile? ¡No me lo puedo creer! Tú siempre decías que bailabas fatal."],["H","Por eso, para aprender. Mi novia baila salsa muy bien y yo me quedo siempre sentado."],["M","Pues mi hermano da clases en una escuela del centro. Te doy su teléfono, si quieres."],["H","Genial, gracias. Oye, ¿tienes tiempo para un café?"],["M","Hoy no puedo, tengo que recoger a mi hija del colegio a las cinco. ¿Quedamos el sábado?"],["H","El sábado por la mañana trabajo, pero por la tarde estoy libre."],["M","Perfecto, el sábado a las seis en la cafetería de la plaza."]],"items":[{"q":"Ha tenido una entrevista de trabajo.","a":0,"w":"Andrés dice: «Vengo de una entrevista de trabajo en la oficina de enfrente»."},{"q":"Antes leía mucho en el transporte.","a":1,"w":"Julia: «Yo antes tardaba cuarenta minutos en llegar al trabajo y leía un libro a la semana»."},{"q":"Hace teatro.","a":1,"w":"Julia hace teatro los martes por la noche y prepara una comedia."},{"q":"Toca en un grupo de música.","a":2,"w":"Andrés dejó el grupo de música el año pasado, así que ahora ninguno de los dos toca en un grupo."},{"q":"Quiere aprender a bailar.","a":0,"w":"Andrés quiere apuntarse a clases de baile porque su novia baila salsa."},{"q":"No puede tomar un café hoy.","a":1,"w":"Julia: «Hoy no puedo, tengo que recoger a mi hija del colegio»."}]},{"t":4,"opts":["Hay que llegar antes de la hora.","Se ha cancelado una actividad.","Hay que cambiar de andén.","Pueden recoger un pedido.","Hay una oferta en una sección de la tienda.","Tiene que llamar para confirmar una cita.","El servicio funciona con un horario diferente.","Un niño se ha perdido.","Hay que apagar los teléfonos móviles.","Le invitan a una fiesta."],"msgs":[{"s":[["N","Hola, señor Ruiz. Le llamamos de la tienda de electrodomésticos Hogar. Su nueva lavadora ya ha llegado. Puede pasar a recogerla cuando quiera, de lunes a sábado. Recuerde traer el tique de compra. Muchas gracias por su compra."]],"a":3,"w":"La lavadora que compró ya ha llegado y puede recogerla."},{"s":[["N","Atención, señores pasajeros: el tren con destino Sevilla, que tenía su salida por la vía 4, saldrá por la vía 7. Repetimos: el tren con destino Sevilla saldrá por la vía 7. Próxima salida en diez minutos."]],"a":2,"w":"El tren sale por otra vía: hay que cambiar de andén."},{"s":[["N","Hola, Marta, soy Clara, de la clínica dental. Te llamo para recordarte tu cita de mañana a las diez. Por favor, llámanos esta tarde para decirnos si puedes venir. Gracias. Que tengas un buen día."]],"a":5,"w":"Le piden que llame para decir si puede ir a la cita."},{"s":[["N","Señores clientes: durante esta semana, en la sección de deportes de la segunda planta, todas las zapatillas tienen un treinta por ciento de descuento. No pierdan esta oportunidad. Gracias por su atención."]],"a":4,"w":"Hay un descuento en la sección de deportes."},{"s":[["N","Aviso para los padres: hoy la clase de natación de las seis no se va a hacer porque la piscina está cerrada por una avería. Les informaremos por correo electrónico de la nueva fecha. Sentimos las molestias."]],"a":1,"w":"La clase de natación de hoy se ha cancelado por una avería."},{"s":[["N","Estimado público, la función va a comenzar en cinco minutos. Les rogamos que apaguen sus teléfonos móviles y que no hagan fotografías durante el espectáculo. Gracias. Esperamos que disfruten de la función."]],"a":8,"w":"Piden apagar los móviles antes de la función."},{"s":[["N","Biblioteca Central informa: durante el mes de agosto, el horario de apertura será de nueve de la mañana a dos de la tarde. A partir de septiembre volveremos al horario habitual. Gracias por su comprensión."]],"a":6,"w":"En agosto la biblioteca tiene un horario distinto."}]}]},{"id":"L2","title":"Salud, trabajo y vecinos","tasks":[{"t":1,"items":[{"s":[["H","Buenos días. Me duele mucho la garganta desde ayer. ¿Qué me recomienda?"],["M","¿Tiene fiebre?"],["H","No, fiebre no, pero tengo un poco de tos."],["M","Pues tome estas pastillas tres veces al día, después de comer. Si en tres días no está mejor, vaya al médico."],["H","Muchas gracias. ¿Cuánto es?"],["M","Seis euros con cincuenta."]],"q":"¿Qué le pasa al hombre?","o":["Tiene fiebre.","Le duele la garganta.","Le duele el estómago."],"a":1,"w":"«Me duele mucho la garganta desde ayer». No tiene fiebre."},{"s":[["M","¿Cuánto cuestan estas manzanas?"],["H","Las rojas, dos euros el kilo, y las verdes, dos cincuenta."],["M","Póngame un kilo de las rojas. ¿Y las naranjas?"],["H","Las naranjas están en oferta: tres kilos por cuatro euros."],["M","Uy, qué bien. Entonces, tres kilos de naranjas también."],["H","Son ocho euros en total."],["M","Aquí tiene, gracias."]],"q":"¿Qué compra la mujer?","o":["Manzanas verdes y naranjas.","Solo manzanas rojas.","Manzanas rojas y naranjas."],"a":2,"w":"Pide un kilo de manzanas rojas y, por la oferta, tres kilos de naranjas."},{"s":[["H","Oye, ¿quedamos el viernes para ir al cine?"],["M","El viernes no puedo, tengo una cena con mis compañeros de trabajo. ¿Y el sábado?"],["H","El sábado por la tarde juego al fútbol, pero por la noche sí puedo."],["M","Vale, pues el sábado por la noche. Hay una sesión a las diez."],["H","Genial. Compro yo las entradas por internet esta tarde."],["M","Vale, y yo te invito a cenar después."]],"q":"¿Cuándo van a ir al cine?","o":["El viernes por la noche.","El sábado por la tarde.","El sábado por la noche."],"a":2,"w":"Él juega al fútbol el sábado por la tarde, así que quedan «el sábado por la noche»."},{"s":[["M","Hola, quería cambiar estos pantalones. Me quedan pequeños."],["H","¿Quiere la talla cuarenta?"],["M","Sí, por favor. Y si es posible, en negro en vez de en gris."],["H","Lo siento, en negro solo nos queda la treinta y ocho. En gris sí tengo la cuarenta."],["M","Bueno, pues gris, entonces."],["H","Muy bien. Si tiene algún problema, puede volver con el tique."]],"q":"¿Qué pantalones se lleva la mujer?","o":["Unos negros de la talla 38.","Unos grises de la talla 40.","Unos negros de la talla 40."],"a":1,"w":"En negro solo queda la 38, que le queda pequeña, así que se lleva los grises de la talla 40."},{"s":[["H","Perdone, ¿este autobús va al hospital?"],["M","No, este va al centro. Para el hospital tiene que coger el 12."],["H","¿Y dónde para el 12?"],["M","En la otra parada, cruzando la calle, delante del supermercado."],["H","Muchas gracias. ¿Y sabe si pasa muy a menudo?"],["M","Sí, cada diez minutos más o menos."]],"q":"¿Dónde puede coger el hombre el autobús al hospital?","o":["En esta misma parada.","Delante del supermercado.","En el centro."],"a":1,"w":"El 12 para «cruzando la calle, delante del supermercado»."},{"s":[["M","¿Dónde has dejado las llaves del coche?"],["H","Creo que en la mesa de la cocina."],["M","No, ahí no están. He mirado también en el bolso."],["H","Ah, ya me acuerdo: en el bolsillo de mi chaqueta, la que está en el armario de la entrada."],["M","¡Menos mal! Vamos, que llegamos tarde a la cena."]],"q":"¿Dónde están las llaves?","o":["En la cocina.","En el bolso.","En una chaqueta."],"a":2,"w":"Al final él recuerda: «en el bolsillo de mi chaqueta»."}]},{"t":2,"items":[{"s":[["N","El Ayuntamiento informa: la campaña de vacunación contra la gripe empieza el próximo lunes en todos los centros de salud de la ciudad. Pueden vacunarse los mayores de sesenta años y las personas con enfermedades crónicas. Es necesario pedir cita. Las personas vacunadas recibirán un certificado."]],"q":"Para vacunarse de la gripe…","o":["hay que pedir cita.","solo hay que ir al hospital.","no hay límite de edad."],"a":0,"w":"«Es necesario pedir cita». Es para mayores de sesenta y enfermos crónicos, en los centros de salud."},{"s":[["N","¿Buscas trabajo? La feria de empleo de la universidad se celebra este miércoles y jueves en el pabellón de deportes. Más de cien empresas buscan estudiantes y recién graduados. No olvides llevar varias copias de tu currículum. La entrada es gratuita para todos los estudiantes."]],"q":"En la feria de empleo…","o":["solo participan empresas pequeñas.","es recomendable llevar el currículum.","hay que pagar para entrar."],"a":1,"w":"«No olvides llevar varias copias de tu currículum»."},{"s":[["N","Buenas noticias para los amantes de los animales: el refugio municipal organiza este domingo una jornada de puertas abiertas. Las familias podrán conocer a los perros y gatos que buscan un hogar. Habrá actividades para niños de diez a dos. El refugio está en la carretera de la playa, kilómetro tres."]],"q":"El domingo en el refugio…","o":["se pueden comprar animales.","se puede conocer a animales para adoptar.","solo pueden entrar adultos."],"a":1,"w":"Las familias podrán conocer a los animales «que buscan un hogar». Hay actividades para niños."},{"s":[["N","Les informamos de que, por la huelga de controladores aéreos, mañana se han cancelado treinta vuelos en el aeropuerto. Los pasajeros afectados deben consultar la página web de su compañía aérea antes de ir al aeropuerto. Las compañías ofrecerán otros vuelos o la devolución del dinero."]],"q":"Los pasajeros afectados deben…","o":["ir al aeropuerto lo antes posible.","informarse en internet.","llamar al aeropuerto."],"a":1,"w":"Deben «consultar la página web de su compañía aérea antes de ir»."},{"s":[["N","Este sábado, el mercado central celebra su cien aniversario. Habrá degustaciones gratuitas de productos típicos, música en directo y un concurso de cocina para aficionados. El mercado abrirá excepcionalmente hasta las diez de la noche. Además, habrá una exposición de fotos antiguas del mercado."]],"q":"El sábado el mercado central…","o":["cierra antes de lo normal.","cumple cien años.","está cerrado por la fiesta."],"a":1,"w":"«Celebra su cien aniversario» y abre hasta más tarde, hasta las diez de la noche."},{"s":[["N","Consejo de salud del día: los médicos recomiendan beber dos litros de agua al día, sobre todo en verano. También aconsejan no hacer deporte al aire libre en las horas de más calor, entre las doce y las cinco de la tarde. Y no olviden usar crema para el sol."]],"q":"Según los médicos, en verano es mejor…","o":["hacer deporte a mediodía.","no hacer deporte fuera con mucho calor.","beber menos agua."],"a":1,"w":"Aconsejan «no hacer deporte al aire libre en las horas de más calor»."}]},{"t":3,"names":{"H":"Raúl","M":"Nuria"},"s":[["H","Nuria, ¿tienes un momento? Quería hablar contigo de la reunión de vecinos de mañana."],["M","Claro, Raúl. ¿Qué pasa?"],["H","Es por el ascensor. Lleva estropeado dos semanas y mi madre, que vive conmigo, no puede subir las escaleras. Tiene ochenta años y le duelen las piernas."],["M","Ya, es un problema. Yo vivo en el sexto y subo con la compra a pie todos los días. Pero el presidente dice que la reparación es muy cara."],["H","Sí, unos ocho mil euros. Pero yo he pedido otro presupuesto a otra empresa y es más barato: cinco mil quinientos."],["M","¡Qué bien! Eso hay que decirlo mañana. ¿Vas a ir a la reunión?"],["H","No puedo, tengo turno de noche en el hospital. Por eso te lo cuento a ti. ¿Puedes presentar tú el presupuesto?"],["M","Sí, sin problema. Dámelo y lo llevo. Oye, ¿y no se puede hacer algo con el ruido del bar de abajo? Yo no puedo dormir los fines de semana."],["H","A mí no me molesta mucho, porque mi piso da al patio. Pero sé que muchos vecinos se quejan."],["M","Pues también voy a hablar de eso. Y otra cosa: ¿sabes que van a pintar la fachada en primavera?"],["H","No sabía nada. ¿Y cuánto vamos a pagar cada uno?"],["M","Todavía no se sabe. Lo van a decidir mañana. Te mando un mensaje después de la reunión y te cuento."],["H","Muchas gracias, Nuria. Te debo una. Si quieres, el domingo os invito a ti y a tu marido a comer."],["M","¡Hecho! Pero cocino yo el postre."]],"items":[{"q":"Vive con su madre.","a":0,"w":"Raúl: «mi madre, que vive conmigo, no puede subir las escaleras»."},{"q":"Sube las escaleras con la compra.","a":1,"w":"Nuria: «Yo vivo en el sexto y subo con la compra a pie todos los días»."},{"q":"Ha conseguido un presupuesto más barato.","a":0,"w":"Raúl ha pedido otro presupuesto «más barato: cinco mil quinientos»."},{"q":"Trabaja en un bar.","a":2,"w":"El bar solo se menciona por el ruido. Raúl trabaja en un hospital y no se dice dónde trabaja Nuria."},{"q":"Tiene problemas por el ruido.","a":1,"w":"Nuria: «Yo no puedo dormir los fines de semana». A Raúl no le molesta porque su piso da al patio."},{"q":"Sabe cuánto va a costar pintar la fachada.","a":2,"w":"«Todavía no se sabe. Lo van a decidir mañana»: ninguno de los dos lo sabe."}]},{"t":4,"opts":["Tiene que traer un documento.","La tienda cambia de lugar.","El servicio está cerrado temporalmente.","Hay plazas libres en una actividad.","Un vuelo sale con retraso.","Debe ir a una sala concreta.","Le han encontrado algo que había perdido.","Puede pagar con tarjeta.","Hay un menú especial.","Tiene un regalo por su compra."],"msgs":[{"s":[["N","Pasajeros del vuelo 2345 con destino a Roma: les informamos de que su vuelo tiene un retraso de una hora y media. La nueva hora de salida es a las 18:45. Sentimos las molestias. Por favor, permanezcan atentos a las pantallas."]],"a":4,"w":"El vuelo a Roma sale una hora y media más tarde."},{"s":[["N","Hola, buenas tardes. Le llamamos de la oficina de objetos perdidos de la estación. Tenemos aquí su cartera con su documentación. Puede venir a buscarla de ocho a ocho. Gracias."]],"a":6,"w":"Han encontrado su cartera."},{"s":[["N","Señora García, por favor, pase a la consulta número cinco, en la segunda planta. Señora García, a la consulta número cinco. El doctor la está esperando."]],"a":5,"w":"Le dicen a qué consulta debe ir."},{"s":[["N","Hola, soy Pedro, de la academia de idiomas. Te llamo porque todavía quedan tres plazas en el curso de inglés de los martes. Si te interesa, llámame antes del viernes. El curso empieza el próximo martes a las seis."]],"a":3,"w":"Quedan plazas libres en el curso de inglés."},{"s":[["N","Estimados clientes: desde el lunes, nuestra tienda estará en la calle Alcalá, número 50, a cien metros de la actual. Mantenemos el mismo horario y el mismo teléfono. Les esperamos en nuestra nueva dirección."]],"a":1,"w":"La tienda se traslada a otra dirección."},{"s":[["N","Buenos días, le recordamos que para su cita de mañana en el banco necesita traer su DNI y la última nómina. Sin esos documentos no podremos abrir la cuenta. Gracias y hasta mañana."]],"a":0,"w":"Debe traer el DNI y la nómina a la cita."},{"s":[["N","Informamos a nuestros usuarios de que la piscina cubierta permanecerá cerrada hasta el día quince por trabajos de limpieza. Disculpen las molestias. Pueden usar la piscina exterior mientras tanto."]],"a":2,"w":"La piscina está cerrada unos días por limpieza."}]}]},{"id":"L3","title":"Viajes y vacaciones","tasks":[{"t":1,"items":[{"s":[["M","Buenas tardes. Tengo una habitación reservada para tres noches. Me llamo Inés Moreno."],["H","Sí, señora Moreno. Habitación doble, con desayuno. Es la 214, en la segunda planta."],["M","¿A qué hora es el desayuno?"],["H","De siete a diez y media, en el restaurante de la planta baja."],["M","Perfecto. ¿Y hay wifi en la habitación?"],["H","Sí, la contraseña está en la tarjeta de la habitación."]],"q":"¿Dónde se sirve el desayuno?","o":["En la habitación.","En la segunda planta.","En la planta baja."],"a":2,"w":"El desayuno es «en el restaurante de la planta baja». La habitación está en la segunda planta."},{"s":[["H","¿Qué hacemos mañana? ¿Vamos a la playa?"],["M","Dicen que va a llover todo el día. Mejor vamos al museo de arte moderno."],["H","¿Y por la tarde? Podemos ir de compras."],["M","Vale, pero antes quiero comer en ese restaurante de pescado del puerto."],["H","Muy bien, pues reservo mesa para las dos."]],"q":"¿Qué van a hacer primero mañana?","o":["Ir a la playa.","Visitar un museo.","Ir de compras."],"a":1,"w":"Como va a llover, deciden ir «al museo de arte moderno» por la mañana. Las compras son por la tarde."},{"s":[["M","Perdone, ¿a qué hora sale el próximo barco a la isla?"],["H","Hay uno a las cuatro, pero ya está lleno. El siguiente sale a las cinco y media."],["M","¿Y cuánto dura el viaje?"],["H","Unos cuarenta minutos. El último barco de vuelta sale de la isla a las nueve."],["M","Entonces quiero un billete de ida y vuelta para el barco de las cinco y media."]],"q":"¿A qué hora puede salir la mujer hacia la isla?","o":["A las 16:00.","A las 17:30.","A las 21:00."],"a":1,"w":"El barco de las cuatro está lleno; el siguiente sale «a las cinco y media». Las nueve es el último barco de vuelta."},{"s":[["H","¿Qué llevas en la maleta? Pesa muchísimo."],["M","Pues ropa, zapatos, dos libros y el secador de pelo."],["H","El hotel tiene secador, no hace falta llevarlo."],["M","Ah, ¿sí? Entonces lo saco. Pero los libros me los llevo, que en la playa me gusta leer."],["H","Vale, pero cierra ya la maleta, que el taxi llega en diez minutos."]],"q":"¿Qué saca la mujer de la maleta?","o":["Los zapatos.","Los libros.","El secador."],"a":2,"w":"Como el hotel tiene secador, dice: «Entonces lo saco». Los libros se los lleva."},{"s":[["M","Quería alquilar un coche para el fin de semana."],["H","Tenemos uno pequeño por cuarenta euros al día y uno grande por sesenta y cinco."],["M","Somos cinco personas con maletas."],["H","Entonces necesita el grande. Lo puede recoger mañana a partir de las nueve."],["M","Muy bien. ¿Necesita mi carné de conducir?"],["H","Sí, y una tarjeta de crédito, por favor."]],"q":"¿Cuánto cuesta al día el coche que necesita la mujer?","o":["40 euros.","65 euros.","9 euros."],"a":1,"w":"Son cinco personas con maletas y necesitan el grande, que cuesta «sesenta y cinco». El nueve es la hora."},{"s":[["H","Mira, esta es la foto de la casa rural que he encontrado para agosto."],["M","Es preciosa. ¿Tiene piscina?"],["H","No, piscina no, pero hay un río muy cerca para bañarse. Y tiene una terraza enorme con barbacoa."],["M","¡Perfecto! Y está en la montaña, ¿no? Así no pasamos tanto calor."],["H","Exacto. Y el pueblo más cercano está a cinco kilómetros. ¿La reservo?"],["M","¡Sí, resérvala ya!"]],"q":"¿Qué tiene la casa rural?","o":["Una piscina.","Una terraza con barbacoa.","Vistas al mar."],"a":1,"w":"«Tiene una terraza enorme con barbacoa». No tiene piscina y está en la montaña."}]},{"t":2,"items":[{"s":[["N","Renfe informa: a partir del próximo mes habrá un nuevo tren de alta velocidad entre Madrid y Granada. El viaje durará menos de tres horas y habrá cinco trenes al día. Los billetes ya se pueden comprar en la web con un veinte por ciento de descuento."]],"q":"Los billetes del nuevo tren…","o":["todavía no están a la venta.","tienen un precio especial en internet.","solo se venden en la estación."],"a":1,"w":"«Los billetes ya se pueden comprar en la web con un veinte por ciento de descuento»."},{"s":[["N","Si este verano vas a viajar fuera de la Unión Europea, recuerda revisar tu pasaporte. Muchos países piden que tenga una validez de al menos seis meses. Si necesitas renovarlo, pide cita en la comisaría con tiempo, porque en verano hay mucha demanda. La renovación cuesta unos treinta euros."]],"q":"La noticia recomienda…","o":["viajar solo por Europa.","comprobar la fecha de caducidad del pasaporte.","ir a la comisaría sin cita."],"a":1,"w":"«Recuerda revisar tu pasaporte»: debe tener al menos seis meses de validez."},{"s":[["N","El Museo del Prado abre esta semana una exposición sobre los viajes de los pintores españoles por Italia. Se podrán ver más de ochenta obras, algunas nunca expuestas antes. La exposición estará abierta hasta el mes de enero. El precio de la entrada es de quince euros."]],"q":"En la nueva exposición…","o":["hay obras que nunca se han visto.","solo hay pintores italianos.","se puede ver solo esta semana."],"a":0,"w":"Hay más de ochenta obras, «algunas nunca expuestas antes». Estará abierta hasta enero."},{"s":[["N","Las playas de la costa norte tienen este año bandera azul, que garantiza la calidad del agua y los servicios. Este verano, además, habrá socorristas todos los días de junio a septiembre, de once de la mañana a ocho de la tarde. Recuerden que en algunas playas está prohibido llevar perros."]],"q":"Este verano, en las playas de la costa norte…","o":["habrá socorristas por la noche.","habrá vigilancia todos los días.","el agua no es de buena calidad."],"a":1,"w":"«Habrá socorristas todos los días de junio a septiembre», de once a ocho."},{"s":[["N","¿Te gusta caminar? La asociación Senderos organiza cada domingo una excursión por la sierra. Las rutas son fáciles, de unos diez kilómetros, y están pensadas para familias. Solo tienes que llevar agua, comida y calzado cómodo. La salida es a las nueve desde la estación de autobuses."]],"q":"Las excursiones de la asociación Senderos…","o":["son para personas con mucha experiencia.","salen desde la estación de autobuses.","se hacen los sábados."],"a":1,"w":"«La salida es a las nueve desde la estación de autobuses». Son los domingos y las rutas son fáciles."},{"s":[["N","Último aviso para los viajeros: este fin de semana se espera mucho tráfico en las carreteras por el inicio de las vacaciones. Tráfico recomienda salir temprano por la mañana o por la noche y descansar cada dos horas de viaje. Y, por supuesto, no usen el móvil mientras conducen."]],"q":"Tráfico recomienda…","o":["no viajar este fin de semana.","salir a mediodía.","parar a descansar durante el viaje."],"a":2,"w":"Recomienda «descansar cada dos horas de viaje» y salir temprano o por la noche."}]},{"t":3,"names":{"H":"Carlos","M":"Laura"},"s":[["M","¡Hola, Carlos! ¿Ya has vuelto de las vacaciones?"],["H","Sí, Laura, llegué anoche. Estoy cansadísimo, pero ha sido un viaje increíble."],["M","¿Al final fuiste a México?"],["H","Sí, tres semanas. Primero estuve en la capital, y luego fui a la playa, a Tulum. Lo que más me gustó fueron las pirámides mayas."],["M","¡Qué envidia! Yo nunca he estado en América. Este año me he quedado aquí, porque estoy ahorrando para comprarme un piso."],["H","Bueno, pero algo habrás hecho, ¿no?"],["M","Sí, fui una semana al pueblo de mis abuelos, en Galicia. Me bañé en el río, comí muchísimo y dormí mucho. Fue muy tranquilo."],["H","Eso también está muy bien. Yo en el viaje casi no dormí: dormíamos poco para ver muchas cosas."],["M","¿Fuiste solo?"],["H","No, con mi hermano. Él habla muy bien español porque vivió allí dos años, así que nos ayudó mucho. Yo todavía tengo que mejorar."],["M","¿Y la comida?"],["H","Buenísima, pero muy picante para mí. El primer día estuve enfermo del estómago."],["M","¡Pobre! A mí me encanta la comida picante. ¿Y tienes fotos?"],["H","Tengo más de mil. Si quieres, el viernes vienes a casa y te las enseño. Además, te he traído un regalo."],["M","¡Ay, qué bien! El viernes trabajo hasta las siete, pero después voy."],["H","Perfecto. Te espero a las ocho y cenamos tacos. ¡Yo cocino!"]],"items":[{"q":"Ha estado de vacaciones en otro continente.","a":0,"w":"Carlos ha estado tres semanas en México."},{"q":"Está ahorrando dinero para una casa.","a":1,"w":"Laura: «estoy ahorrando para comprarme un piso»."},{"q":"Ha descansado mucho en vacaciones.","a":1,"w":"Laura, en el pueblo de sus abuelos, comió y «dormí mucho». Carlos casi no durmió."},{"q":"Ha vivido en México.","a":2,"w":"Quien vivió dos años allí es el hermano de Carlos, que no está en la conversación. Ni Carlos ni Laura."},{"q":"No le gusta la comida picante.","a":0,"w":"Para Carlos la comida era «muy picante para mí» y estuvo enfermo. A Laura le encanta el picante."},{"q":"El viernes trabaja hasta tarde.","a":1,"w":"Laura: «El viernes trabajo hasta las siete»."}]},{"t":4,"opts":["El viaje dura más de lo previsto.","Hay que presentarse en la puerta de embarque.","La excursión empieza más tarde.","El hotel ofrece un servicio gratuito.","Ha cambiado la puerta de embarque.","Le informan de que han recibido un pago.","Se recomienda llevar ropa de abrigo.","Hay que esperar dentro del autobús.","Han encontrado un niño.","No se puede comer en este lugar."],"msgs":[{"s":[["N","Última llamada para los pasajeros del vuelo IB 3170 con destino a Londres. Embarquen inmediatamente por la puerta B 22. La puerta se cerrará en cinco minutos. Gracias."]],"a":1,"w":"Es la última llamada: deben ir ya a la puerta de embarque."},{"s":[["N","Buenos días. Le informamos de que la excursión a los lagos, que estaba prevista a las ocho, saldrá a las nueve y media por un problema con el autobús. El punto de encuentro sigue siendo la recepción del hotel. Sentimos las molestias. Les esperamos en la recepción."]],"a":2,"w":"La excursión sale hora y media más tarde."},{"s":[["N","Señores clientes, les recordamos que el hotel ofrece un servicio de autobús gratuito al centro de la ciudad cada hora, desde las nueve de la mañana. La parada está delante de la entrada principal. El viaje dura unos quince minutos."]],"a":3,"w":"El autobús al centro es gratuito para los clientes."},{"s":[["N","Atención, señores pasajeros: debido al mal tiempo, el tren circula a menor velocidad. La llegada a Barcelona está prevista con cuarenta minutos de retraso. Disculpen las molestias. Les mantendremos informados."]],"a":0,"w":"El tren llegará con cuarenta minutos de retraso."},{"s":[["N","Hola, le llamamos de la agencia Viajes Sol. Le confirmamos que hemos recibido el pago de su viaje a Canarias. En unos días le enviaremos los billetes por correo electrónico. Muchas gracias por confiar en nosotros."]],"a":5,"w":"La agencia confirma que ha recibido el pago."},{"s":[["N","Para la visita de mañana a la montaña, les recomendamos llevar chaqueta y gorro, porque en la cumbre la temperatura puede bajar hasta cinco grados, aunque estemos en verano. Y no olviden llevar agua."]],"a":6,"w":"Recomiendan llevar ropa de abrigo porque hará frío arriba."},{"s":[["N","Atención: los pasajeros con destino Málaga deben dirigirse a la puerta C 14. Su vuelo ya no sale por la puerta C 8. Repetimos: puerta C 14. Gracias por su atención."]],"a":4,"w":"El vuelo a Málaga sale por otra puerta."}]}]},{"id":"L4","title":"Estudios y tiempo libre","tasks":[{"t":1,"items":[{"s":[["H","Hola, quería apuntarme a las clases de español."],["M","Muy bien. Tenemos clases por la mañana, de nueve a once, y por la tarde, de seis a ocho."],["H","Por la mañana trabajo. ¿Hay clases los sábados?"],["M","No, los sábados no. Entonces, ¿por la tarde?"],["H","Sí, por la tarde, perfecto."],["M","Muy bien. Necesito su pasaporte y una foto. Las clases empiezan el lunes."]],"q":"¿Cuándo va a tener clase el hombre?","o":["Por la mañana.","Por la tarde.","Los sábados."],"a":1,"w":"Trabaja por la mañana y no hay clases los sábados, así que elige «por la tarde»."},{"s":[["M","¿Qué quieres ver esta noche en la tele?"],["H","Hay un partido de fútbol a las nueve."],["M","Uf, otra vez fútbol. ¿Por qué no vemos la película de Almodóvar que ponen en La 2?"],["H","Vale, pero el partido lo grabo y lo veo mañana."],["M","Perfecto. Yo preparo unas palomitas."]],"q":"¿Qué van a ver esta noche?","o":["Un partido de fútbol.","Una película.","Las noticias."],"a":1,"w":"Él acepta ver la película y grabar el partido para mañana."},{"s":[["M","Perdona, ¿la biblioteca abre los domingos?"],["H","No, los domingos está cerrada. De lunes a viernes abre de ocho a nueve de la noche, y los sábados solo por la mañana."],["M","¿Y en época de exámenes?"],["H","En junio la sala de estudio abre también los domingos, hasta las dos."],["M","Ah, muy bien. Muchas gracias por la información."],["H","De nada. Suerte con los exámenes."]],"q":"¿Cuándo abre la biblioteca normalmente?","o":["Todos los días.","De lunes a sábado.","Solo entre semana."],"a":1,"w":"Abre de lunes a viernes y los sábados por la mañana; los domingos solo en junio."},{"s":[["H","¿Cómo vas a ir a la universidad mañana?"],["M","Normalmente voy en bici, pero mañana va a llover."],["H","¿Y en autobús?"],["M","Tarda mucho. Creo que voy a ir en metro: son quince minutos."],["H","Pues si quieres, vamos juntos. Yo también voy en metro."],["M","¡Genial! Nos vemos a las ocho en la estación."]],"q":"¿Cómo va a ir la mujer a la universidad mañana?","o":["En bicicleta.","En autobús.","En metro."],"a":2,"w":"Por la lluvia no va en bici y el autobús tarda mucho: «voy a ir en metro»."},{"s":[["M","¿Qué tal el examen de matemáticas?"],["H","Fatal. No me ha dado tiempo a terminar el último ejercicio."],["M","Bueno, seguro que apruebas. ¿Y el de historia?"],["H","Ese es el viernes. Hoy por la tarde voy a estudiar en la biblioteca con Marcos."],["M","Muy bien. ¡Suerte! Luego me cuentas."]],"q":"¿Qué va a hacer el chico esta tarde?","o":["Un examen de historia.","Estudiar con un amigo.","Repetir el examen de matemáticas."],"a":1,"w":"«Hoy por la tarde voy a estudiar en la biblioteca con Marcos». El examen de historia es el viernes."},{"s":[["H","Dos entradas para la película de las ocho, por favor."],["M","Lo siento, para las ocho solo quedan asientos en la primera fila."],["H","Uy, no, ahí no se ve bien. ¿Y para la de las diez y media?"],["M","Para esa hay sitio en el centro."],["H","Pues para las diez y media."],["M","Son quince euros. ¿Quiere palomitas o bebida?"],["H","No, gracias."]],"q":"¿Para qué sesión compra las entradas?","o":["Para las 20:00 en la primera fila.","Para las 20:00 en el centro.","Para las 22:30."],"a":2,"w":"No quiere la primera fila, así que compra «para las diez y media», con sitio en el centro."}]},{"t":2,"items":[{"s":[["N","La Universidad de Salamanca abre el plazo de matrícula para los cursos de verano de español. Los cursos empiezan el uno de julio y duran cuatro semanas. Los estudiantes pueden alojarse en residencias universitarias o con familias de la ciudad. El precio incluye excursiones los fines de semana."]],"q":"Los estudiantes de los cursos de verano…","o":["pueden vivir con una familia.","estudian durante cuatro meses.","empiezan en junio."],"a":0,"w":"Pueden alojarse en residencias «o con familias de la ciudad». Los cursos duran cuatro semanas y empiezan en julio."},{"s":[["N","Este viernes, en el auditorio municipal, concierto de la orquesta joven de la ciudad. Interpretarán música de compositores españoles como Falla y Albéniz. Las entradas cuestan cinco euros y el dinero se dará a una asociación de ayuda a la infancia. El concierto empieza a las ocho de la tarde."]],"q":"El dinero de las entradas del concierto…","o":["es para la orquesta.","es para una asociación.","es para el auditorio."],"a":1,"w":"«El dinero se dará a una asociación de ayuda a la infancia»."},{"s":[["N","Nueva encuesta: los jóvenes españoles pasan una media de cuatro horas al día con el móvil. La actividad más común es ver vídeos, seguida de las redes sociales. Solo un quince por ciento usa el móvil para leer libros o noticias. Los expertos recomiendan no usar el móvil antes de dormir."]],"q":"Según la encuesta, los jóvenes usan el móvil sobre todo para…","o":["leer noticias.","ver vídeos.","hablar por teléfono."],"a":1,"w":"«La actividad más común es ver vídeos»."},{"s":[["N","El club de ajedrez del barrio organiza un torneo para todas las edades el próximo sábado en el centro cívico. La inscripción es gratuita y los ganadores recibirán libros y material de ajedrez. Las inscripciones se cierran el jueves. El torneo empieza a las diez de la mañana."]],"q":"Para participar en el torneo de ajedrez…","o":["hay que pagar una inscripción.","hay que apuntarse antes del viernes.","hay que ser menor de edad."],"a":1,"w":"«Las inscripciones se cierran el jueves». Es gratuito y para todas las edades."},{"s":[["N","Desde el próximo curso, todos los colegios públicos de la región ofrecerán clases de programación informática a partir de los diez años. El objetivo es preparar a los alumnos para los trabajos del futuro. Las clases serán de una hora a la semana. Los profesores recibirán una formación especial durante el verano."]],"q":"A partir del próximo curso, en los colegios públicos…","o":["habrá clases de informática.","los alumnos tendrán más vacaciones.","no se usarán ordenadores."],"a":0,"w":"Ofrecerán «clases de programación informática a partir de los diez años»."},{"s":[["N","El parque de atracciones abre su temporada el próximo sábado con una nueva montaña rusa, la más alta del país. Durante el primer fin de semana, los niños menores de doce años entrarán gratis si van acompañados por un adulto. El parque abre todos los días de diez de la mañana a nueve de la noche."]],"q":"El primer fin de semana en el parque de atracciones…","o":["los niños no pagan entrada.","los adultos entran gratis.","la montaña rusa está cerrada."],"a":0,"w":"Los menores de doce años «entrarán gratis si van acompañados por un adulto»."}]},{"t":3,"names":{"H":"Tomás","M":"Elena"},"s":[["H","Elena, ¿ya has decidido qué vas a estudiar el año que viene?"],["M","Creo que sí, Tomás. Quiero estudiar Medicina. Me encanta la biología y quiero ayudar a la gente."],["H","¡Medicina! Son muchos años. Y hay que sacar una nota muy alta en la prueba de acceso."],["M","Lo sé. Por eso estudio todos los días tres o cuatro horas. Este fin de semana no voy a salir."],["H","Yo no lo tengo tan claro. Mis padres quieren que estudie Derecho, como mi padre, pero a mí me gusta más el diseño gráfico."],["M","Pues tienes que elegir tú. Es tu vida. Además, dibujas muy bien."],["H","Gracias. Estoy pensando en hacer un ciclo de Formación Profesional de diseño. Son dos años y luego puedo trabajar o seguir estudiando."],["M","Es una buena idea. Mi prima hizo un ciclo de fotografía y ahora trabaja en una revista."],["H","¿Y tú vas a estudiar aquí o en otra ciudad?"],["M","Me gustaría ir a Madrid, pero es muy caro vivir allí. Si no puedo, me quedo aquí y vivo con mis padres."],["H","Yo sí quiero irme fuera. Necesito un poco de independencia. A lo mejor voy a Barcelona."],["M","¡Qué bien! Oye, ¿vienes a la fiesta de fin de curso el viernes?"],["H","Sí, claro. Voy a tocar la guitarra con mi grupo."],["M","¿En serio? Entonces voy un rato, aunque después tengo que estudiar."]],"items":[{"q":"Quiere estudiar una carrera larga.","a":1,"w":"Elena quiere estudiar Medicina; Tomás comenta que «son muchos años»."},{"q":"Sus padres quieren que estudie lo mismo que su padre.","a":0,"w":"Los padres de Tomás quieren que estudie Derecho, «como mi padre»."},{"q":"Ha hecho un curso de fotografía.","a":2,"w":"Quien hizo el ciclo de fotografía es la prima de Elena, no ninguno de los dos."},{"q":"Quiere estudiar en Madrid.","a":1,"w":"Elena: «Me gustaría ir a Madrid». Tomás piensa en Barcelona."},{"q":"Quiere vivir solo.","a":0,"w":"Tomás: «Yo sí quiero irme fuera. Necesito un poco de independencia»."},{"q":"Va a tocar en la fiesta.","a":0,"w":"Tomás: «Voy a tocar la guitarra con mi grupo»."}]},{"t":4,"opts":["La clase es en otra aula.","Hay que traer algo para la excursión.","Se ha cancelado un examen.","Un libro está ya disponible.","Las inscripciones terminan pronto.","Hay que pagar una actividad.","El horario de la biblioteca cambia.","Le invitan a una reunión de padres.","Hay un descuento para estudiantes.","Necesitan voluntarios."],"msgs":[{"s":[["N","Hola, Luis. Te llamamos de la biblioteca. El libro que reservaste, «Cien años de soledad», ya ha llegado. Puedes venir a recogerlo durante esta semana. Recuerda traer tu carné de la biblioteca."]],"a":3,"w":"El libro reservado ya se puede recoger."},{"s":[["N","Atención, alumnos de segundo: hoy la clase de inglés no será en el aula 12, sino en el aula 25, en la tercera planta, porque estamos arreglando la calefacción. Gracias."]],"a":0,"w":"La clase de inglés cambia de aula."},{"s":[["N","Recordamos a las familias que mañana los alumnos de cuarto van de excursión al museo de ciencias. Deben traer comida, agua y una gorra. El autobús sale a las nueve en punto. Por favor, sean puntuales."]],"a":1,"w":"Los alumnos deben traer comida, agua y gorra."},{"s":[["N","Estimados padres, el próximo miércoles a las seis de la tarde tendrá lugar la reunión del primer trimestre con los tutores. Es muy importante su asistencia. Gracias por su colaboración."]],"a":7,"w":"Se convoca a los padres a una reunión con los tutores."},{"s":[["N","Último aviso: solo quedan dos días para apuntarse a los cursos de teatro y fotografía del centro cultural. Las plazas son limitadas. Inscripciones en la secretaría. No esperes al último momento."]],"a":4,"w":"Quedan solo dos días para inscribirse."},{"s":[["N","Hola, soy la profesora Martínez. Os informo de que el examen de química del jueves se suspende porque estaré en un congreso. Os diré la nueva fecha la semana que viene. Mientras tanto, seguid estudiando."]],"a":2,"w":"El examen de química se suspende."},{"s":[["N","Cine Capitol: todos los lunes, presentando el carné de estudiante en taquilla, la entrada cuesta solo cuatro euros. No válido para estrenos ni sesiones especiales. Disfruta del mejor cine."]],"a":8,"w":"Los estudiantes tienen entrada más barata los lunes."}]}]},{"id":"L5","title":"Casa, familia y servicios","tasks":[{"t":1,"items":[{"s":[["M","Hola, buenos días. Quería enviar este paquete a Francia."],["H","¿Lo quiere urgente o normal?"],["M","¿Cuánto tarda el normal?"],["H","Entre cinco y siete días. El urgente llega en dos días, pero cuesta el doble."],["M","No hay prisa. Normal, por favor."],["H","Muy bien. Son doce euros. Aquí tiene su recibo."],["M","Gracias, adiós."]],"q":"¿Cómo envía la mujer el paquete?","o":["Urgente, en dos días.","Normal, en una semana aproximadamente.","Por correo electrónico."],"a":1,"w":"«No hay prisa. Normal», que tarda entre cinco y siete días."},{"s":[["H","¿Qué le regalamos a tu madre por su cumpleaños?"],["M","Le encantan las plantas. Podemos comprarle una para el balcón."],["H","¿Y unas flores?"],["M","No, las flores duran muy poco. Mejor una planta, y así se acuerda de nosotros."],["H","Vale. Hay una floristería al lado de casa. Vamos esta tarde."]],"q":"¿Qué van a regalar a la madre?","o":["Unas flores.","Una planta.","Un balcón."],"a":1,"w":"Las flores duran poco: «Mejor una planta»."},{"s":[["M","Buenas tardes, llamo porque no funciona la calefacción de mi piso."],["H","¿Desde cuándo?"],["M","Desde ayer por la noche. Y tengo un bebé en casa."],["H","De acuerdo. Mañana por la mañana, entre las nueve y las once, va un técnico a su casa."],["M","Muchas gracias. ¿Tengo que estar en casa?"],["H","Sí, o alguien que le pueda abrir la puerta."]],"q":"¿Cuándo va a ir el técnico?","o":["Hoy por la tarde.","Mañana por la mañana.","Mañana por la noche."],"a":1,"w":"«Mañana por la mañana, entre las nueve y las once»."},{"s":[["H","¿Qué hacemos con los niños el sábado?"],["M","Podemos llevarlos al zoo."],["H","Fuimos el mes pasado. ¿Y si vamos al parque de atracciones?"],["M","Es muy caro. Mejor vamos en bici al río y comemos allí."],["H","Buena idea, así hacemos ejercicio."],["M","Y llevamos bocadillos y fruta para todos."]],"q":"¿Qué van a hacer el sábado?","o":["Ir al zoo.","Ir al parque de atracciones.","Ir en bicicleta al río."],"a":2,"w":"Deciden ir «en bici al río y comemos allí»."},{"s":[["M","Doctor, mi hijo tiene fiebre desde hace dos días."],["H","A ver… Tiene la garganta un poco roja. No es grave. Que tome este jarabe cada ocho horas y que beba mucha agua."],["M","¿Puede ir al colegio?"],["H","Mejor que se quede en casa hasta que no tenga fiebre."],["M","Muy bien, doctor. Muchas gracias."],["H","De nada. Si mañana sigue igual, vuelva a la consulta."]],"q":"¿Qué tiene que hacer el niño?","o":["Ir al colegio mañana.","Quedarse en casa.","Ir al hospital."],"a":1,"w":"«Mejor que se quede en casa hasta que no tenga fiebre»."},{"s":[["H","Buenos días. ¿Me puede cortar el pelo?"],["M","Claro. ¿Cómo lo quiere?"],["H","Corto por los lados, pero no mucho por arriba. Y la barba, ¿también la arreglan?"],["M","No, lo siento, barba no hacemos. Solo pelo."],["H","Bueno, no pasa nada. Entonces solo el pelo, por favor."],["M","Siéntese aquí, por favor."]],"q":"¿Qué le van a hacer al hombre?","o":["Cortarle el pelo.","Arreglarle la barba.","Cortarle el pelo y la barba."],"a":0,"w":"En la peluquería no arreglan barbas: «Solo pelo»."}]},{"t":2,"items":[{"s":[["N","Cada vez más familias españolas eligen vivir en pueblos pequeños. Según un estudio reciente, el año pasado más de veinte mil personas se fueron de las grandes ciudades al campo. Las principales razones son el precio de la vivienda y la posibilidad de trabajar desde casa. Muchos de ellos tienen hijos pequeños."]],"q":"Según el estudio, muchas personas se van al campo porque…","o":["las casas son más baratas.","hay más trabajo.","hay mejores colegios."],"a":0,"w":"Las razones son «el precio de la vivienda» y el teletrabajo."},{"s":[["N","Atención, vecinos: el próximo martes, de nueve de la mañana a dos de la tarde, no habrá agua en las calles del barrio de San Pablo por unas obras en las tuberías. Se recomienda guardar agua el día anterior. Disculpen las molestias."]],"q":"El martes en el barrio de San Pablo…","o":["no habrá luz.","no habrá agua durante unas horas.","habrá obras toda la semana."],"a":1,"w":"«No habrá agua» de nueve a dos por obras en las tuberías."},{"s":[["N","Nuevo servicio municipal: a partir de este mes, las personas mayores que viven solas pueden pedir que un voluntario las acompañe al médico o a hacer la compra. El servicio es gratuito. Para solicitarlo, hay que llamar al 010. Los voluntarios reciben una formación especial."]],"q":"El nuevo servicio municipal…","o":["es solo para personas jóvenes.","ayuda a las personas mayores.","cuesta diez euros."],"a":1,"w":"Un voluntario acompaña a «las personas mayores que viven solas». Es gratuito; 010 es el teléfono."},{"s":[["N","Consejos para ahorrar energía en casa: apague las luces cuando salga de una habitación, use la lavadora con agua fría y, en invierno, ponga la calefacción a un máximo de veinte grados. Así puede ahorrar hasta un treinta por ciento en la factura."]],"q":"Para ahorrar energía se recomienda…","o":["usar la lavadora con agua caliente.","no poner la calefacción a más de veinte grados.","dejar las luces encendidas."],"a":1,"w":"«Ponga la calefacción a un máximo de veinte grados»."},{"s":[["N","El centro comercial Las Torres celebra su décimo aniversario con una gran fiesta este sábado. Habrá actividades para niños, música y regalos para los primeros cien clientes. Además, todas las tiendas tendrán descuentos durante todo el fin de semana. El centro abre de diez de la mañana a diez de la noche."]],"q":"Este fin de semana en el centro comercial…","o":["todos los clientes recibirán un regalo.","hay rebajas en las tiendas.","solo hay actividades para adultos."],"a":1,"w":"«Todas las tiendas tendrán descuentos durante todo el fin de semana». Los regalos son solo para los cien primeros."},{"s":[["N","Una buena noticia para los padres: el Gobierno ha aprobado aumentar el permiso por nacimiento de un hijo. Además, las familias con tres o más hijos tendrán descuentos en el transporte público y en las actividades deportivas municipales. Las nuevas medidas empezarán en enero."]],"q":"Las familias numerosas tendrán…","o":["transporte público más barato.","más días de vacaciones.","una casa gratis."],"a":0,"w":"Tendrán «descuentos en el transporte público y en las actividades deportivas»."}]},{"t":3,"names":{"H":"Jorge","M":"Pilar"},"s":[["M","Jorge, ¿has visto el piso que te mandé ayer por mensaje?"],["H","Sí, Pilar, lo vi. Es muy bonito, pero está un poco lejos del centro, ¿no?"],["M","A veinte minutos en autobús. Pero tiene tres habitaciones y una terraza grande. Para nosotros y los niños es perfecto."],["H","Ya, pero yo trabajo en el centro y no quiero pasar una hora al día en el autobús."],["M","Puedes ir en bicicleta. Hay un carril bici muy bueno. Yo, en cambio, trabajo desde casa tres días a la semana, así que para mí no es problema."],["H","¿Y el precio?"],["M","Novecientos euros al mes. Es más barato que nuestro piso actual, que es mucho más pequeño."],["H","Bueno, eso está bien. ¿Hay colegio cerca?"],["M","Sí, a cinco minutos andando. Y un parque enfrente. La semana pasada pregunté a una vecina y dice que el barrio es muy tranquilo."],["H","¿Ya has ido a verlo? No me habías dicho nada."],["M","Solo por fuera. Pasé por allí al volver del médico. Para ver el interior hay que llamar a la agencia."],["H","Vale, pues llama tú, que yo esta semana tengo mucho trabajo. ¿Podemos ir el sábado por la mañana?"],["M","El sábado por la mañana los niños tienen natación. Mejor por la tarde."],["H","De acuerdo. Ah, y pregunta si se pueden tener animales, porque el perro viene con nosotros."],["M","Claro, lo primero que voy a preguntar."]],"items":[{"q":"Cree que el piso está lejos del centro.","a":0,"w":"Jorge: «está un poco lejos del centro, ¿no?»."},{"q":"Trabaja algunos días en casa.","a":1,"w":"Pilar: «trabajo desde casa tres días a la semana»."},{"q":"Ha hablado con alguien que vive en el barrio.","a":1,"w":"Pilar preguntó a una vecina, que dice que el barrio es tranquilo."},{"q":"Ha visto el interior del piso.","a":2,"w":"Pilar solo lo vio por fuera y Jorge no ha ido. Ninguno de los dos."},{"q":"Tiene mucho trabajo esta semana.","a":0,"w":"Jorge: «esta semana tengo mucho trabajo»."},{"q":"Va a llamar a la agencia.","a":1,"w":"Jorge le pide a Pilar «llama tú», y ella va a preguntar por los animales."}]},{"t":4,"opts":["Tiene que pasar a firmar un documento.","Han cambiado el día de la recogida de basura.","Su pedido llega más tarde.","Puede comprar entradas con descuento.","La consulta del médico se ha cambiado.","Se ha encontrado un animal.","Hay una reunión de vecinos.","El ascensor no funciona.","Debe dejar libre el aparcamiento.","Su coche está listo."],"msgs":[{"s":[["N","Hola, le llamamos del taller Motor Rápido. Su coche ya está reparado. Puede pasar a recogerlo hoy hasta las siete o mañana a partir de las ocho. Gracias por confiar en nosotros."]],"a":9,"w":"El coche ya está reparado y puede recogerlo."},{"s":[["N","Buenos días, le llamo del centro de salud. Su cita con el doctor Gómez del jueves a las diez se ha pasado al viernes a la misma hora, porque el doctor no estará el jueves. Si no puede venir, llámenos, por favor."]],"a":4,"w":"La cita con el médico cambia del jueves al viernes."},{"s":[["N","Aviso a todos los vecinos: el próximo lunes a las siete de la tarde, en el portal, habrá una reunión para hablar de las obras del tejado. Es importante que vengan todos. Gracias por su colaboración."]],"a":6,"w":"Convocan a los vecinos a una reunión."},{"s":[["N","Estimado cliente: su pedido número 4521 tendrá un retraso de dos días por problemas con el transporte. Lo recibirá el jueves en lugar del martes. Disculpe las molestias. Gracias por su paciencia."]],"a":2,"w":"El pedido llega dos días más tarde."},{"s":[["N","Hola, soy Marta, de la inmobiliaria. Ya tenemos preparado el contrato del piso. ¿Puede venir mañana a la oficina para firmarlo? Traiga su DNI, por favor. Hasta mañana."]],"a":0,"w":"Tiene que ir a firmar el contrato."},{"s":[["N","Informamos a los vecinos de que, a partir del mes que viene, la recogida de cartón y papel se hará los miércoles y no los lunes. Recuerden doblar bien las cajas de cartón."]],"a":1,"w":"El día de recogida del papel cambia al miércoles."},{"s":[["N","Atención: mañana, de ocho a doce, van a pintar las plazas del aparcamiento del edificio. Por favor, saquen sus coches antes de las ocho. Gracias por su colaboración."]],"a":8,"w":"Deben sacar los coches del aparcamiento."}]}]}];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* Flatten a test into its 25 numbered items */
function itemsOf(test){
  const out=[];let n=0;
  test.tasks.forEach(task=>{
    if(test.id[0]==="L"&&task.t===4){task.msgs.forEach((m,i)=>out.push({n:++n,t:4,i,kind:"match10",key:m.a,why:m.w,script:m.s}));return}
    task.items.forEach((it,i)=>{
      if(it.o) out.push({n:++n,t:task.t,i,kind:"mc",key:it.a,why:it.w,q:it.q,o:it.o,script:it.s,x:it.x});
      else out.push({n:++n,t:task.t,i,kind:test.id[0]==="R"?"abc":"hmn",key:it.a,why:it.w,q:it.q});
    });
  });
  return out;
}

/* ---------- speech ---------- */
/* Natural pitch only (no pitch shifting). Prefer real male/female Spanish voices; if the device has
   only one natural voice, every speaker uses it and the player shows who is talking. */
const FEM=/m[oó]nica|helena|laura|luc[ií]a|elvira|paulina|marisol|conchita|esperanza|sabina|isabel|carmen|elena|ximena|dalia|marta|ana\b|paloma|irene|abril|estrella|triana|vera|lola|female|mujer/i;
const MAL=/jorge|pablo|diego|[aá]lvaro|juan|carlos|enrique|ra[uú]l|miguel|antonio|alonso|arturo|gerardo|jorge|dario|dar[ií]o|tom[aá]s|emilio|teo|male|hombre/i;
const QUAL=/natural|neural|premium|enhanced|mejorad|online|google/i;
const TTS={ok:"speechSynthesis" in window,voices:[],cur:null,
  load(){if(!this.ok)return;this.voices=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));},
  rank(v){return (/es[-_]ES/i.test(v.lang)?4:0)+(QUAL.test(v.name)?2:0)+(v.localService===false?1:0)},
  best(re){const c=this.voices.filter(v=>re.test(v.name));c.sort((a,b)=>this.rank(b)-this.rank(a));return c[0]||null},
  byName(n){return n?this.voices.find(v=>v.name===n)||null:null},
  cast(){
    const all=this.voices.slice().sort((a,b)=>this.rank(b)-this.rank(a));
    const f=this.byName(S.voiceM)||this.best(FEM)||all.find(v=>!MAL.test(v.name))||all[0]||null;
    const m=this.byName(S.voiceH)||this.best(MAL)||null;
    return {M:f,H:m||f,N:f||m,distinct:!!(m&&f&&m!==f)};
  },
  speak(script,onend,online){
    if(!this.ok){onend&&onend();return}
    speechSynthesis.cancel();this.load();
    const c=this.cast();let i=0;
    const next=()=>{
      if(i>=script.length){this.cur=null;online&&online(null,c);onend&&onend();return}
      const [role,txt]=script[i++],v=c[role]||c.N,u=new SpeechSynthesisUtterance(txt);
      u.lang=v?v.lang:"es-ES";if(v)u.voice=v;u.pitch=1;u.rate=S.rate;
      u.onstart=()=>online&&online(role,c);

function bindRun(items){

    <div class="row" style="align-items:flex-end;gap:16px"><div class="score num">${r.score}<small> / 25</small></div><div class="note" style="padding-bottom:8px">${l.ref}${r.mode==="exam"?` · ${fmtT(r.used)}`:""}</div></div>
    <div class="breakdown">${per.map((p,i)=>`<div class="bd"><b>${p[0]}/${p[1]}</b><span>${l.tarea} ${i+1}</span></div>`).join("")}</div>
    <div class="grid25">${items.map(it=>`<button type="button" class="cell ${isRight(it)?"ok":"bad"}" data-jump="${it.n}" aria-label="${l.q} ${it.n}">${it.n}</button>`).join("")}</div>
    <div class="row"><button class="btn primary" type="button" id="again">${l.again}</button><button class="btn" type="button" id="backl">${l.back}</button><button class="btn" type="button" id="pdf">${l.pdf}</button></div><div class="note" id="pdfmsg" aria-live="polite"></div></section>
   <section class="sheet"><div class="row" style="justify-content:space-between"><h2>${l.review}</h2><div class="row"><button class="chip" type="button" id="fall" aria-pressed="${!r.only}">${l.all}</button><button class="chip" type="button" id="fwrong" aria-pressed="${r.only}">${l.onlyWrong}</button></div></div>
    <div style="margin-top:6px">${list.map(it=>{const ok=isRight(it),v=r.ans[it.n];
     const scr=kind==="L"?(it.t===3?scriptBox(tk(test,3).s,tk(test,3).names):scriptBox(it.script)):"";
     return `<div class="rv" id="rv-${it.n}"><div class="rvh"><span class="rvn"><b class="${ok?"ok":"bad"}">${it.n}</b><span class="eyebrow">${l.q} ${it.n} · ${l.tarea} ${it.t}</span></span></div>
      <div class="rq">${esc(qText(it,test))}</div><div class="ra">${ok?`<span class="right">✓ ${esc(ansText(it,v,test))}</span>`:`<span class="yours">✗ ${l.yourAns}: ${esc(ansText(it,v,test))}</span><span class="right">✓ ${l.rightAns}: ${esc(ansText(it,it.key,test))}</span>`}</div>${whyBox(it)}${scr}</div>`}).join("")}</div></section></div>`;
  $("#again").onclick=()=>startRun(r.id,r.mode);
  $("#backl").onclick=()=>{S.tab=kind;S.run=null;render();scrollTo({top:0})};
  $("#pdf").onclick=()=>exportPdf(test,items);
  $("#fall").onclick=()=>{r.only=false;keepScroll(()=>renderRun())};$("#fwrong").onclick=()=>{r.only=true;keepScroll(()=>renderRun())};
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const n=+b.dataset.jump,it=items[n-1];
    if(r.only&&isRight(it)){r.only=false;renderRun()}
    const el=document.getElementById("rv-"+n);if(!el)return;
    el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
    el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");const d=el.querySelector("details.why");if(d)d.open=true;});
}

/* ---------- pdf ---------- */
const pdfTxt=s=>String(s).replace(/[…]/g,"...").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/[^\x20-\x7E -ÿ\n]/g,"");
function exportPdf(test,items){
  const r=S.run,l=L(),msg=$("#pdfmsg"),say=t=>{if(msg)msg.textContent=t};
  if(!window.jspdf){say(l.pdfErr);return}
  try{
    const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),W=210,M=16,CW=W-2*M,BOT=284;let y=M;
    const ink=[24,33,58],grey=[110,118,140],ok=[31,122,77],bad=[179,38,30],acc=[29,95,168];
    const need=h=>{if(y+h>BOT){doc.addPage();y=M}};
    const write=(txt,{size=10,style="normal",color=ink,indent=0,gap=1.2}={})=>{doc.setFont("helvetica",style);doc.setFontSize(size);doc.setTextColor(...color);
      String(txt).split("\n").forEach(par=>{const lines=doc.splitTextToSize(pdfTxt(par)||" ",CW-indent),lh=size*0.42;lines.forEach(ln=>{need(lh);doc.text(ln,M+indent,y+lh*0.8);y+=lh})});y+=gap};
    const line=()=>{need(4);doc.setDrawColor(225,229,236);doc.line(M,y,W-M,y);y+=4};
    const es=S.lang==="es",kind=test.id[0];
    write("Repaso DELE A2",{size:9,style:"bold",color:acc,gap:0.5});
    write(`${kind==="R"?(es?"Comprensión de lectura":"Reading"):(es?"Comprensión auditiva":"Listening")} - ${test.id}: ${test.title}`,{size:16,style:"bold",gap:2});
    write(`${es?"Resultado":"Score"}: ${r.score} / 25   ·   ${r.mode==="exam"?l.examLbl:l.pracLbl}${r.mode==="exam"?"   ·   "+l.time+" "+fmtT(r.used):""}   ·   ${new Date(r.start).toLocaleString(es?"es-ES":"en-GB",{dateStyle:"long",timeStyle:"short"})}`,{size:10,style:"bold",color:r.score>=15?ok:bad,gap:1});
    write([1,2,3,4].map(t=>{const x=items.filter(i=>i.t===t);return `${l.tarea} ${t}: ${x.filter(isRight).length}/${x.length}`}).join("     "),{size:9.5,color:grey,gap:3});
    doc.setDrawColor(200,205,218);doc.line(M,y,W-M,y);y+=5;
    [1,2,3,4].forEach(t=>{
      const task=tk(test,t);need(14);write(`${l.tarea} ${t}`,{size:13,style:"bold",color:acc,gap:1});write(INSTR[kind][t],{size:9,color:grey,gap:2});
      if(kind==="R"&&(t===1||t===4)){write(task.texts[0].h,{size:10.5,style:"bold",gap:1});write(task.texts[0].b,{size:9.5,gap:3})}
      if(kind==="R"&&t===3)task.texts.forEach(tx=>{write(tx.h,{size:10,style:"bold",gap:0.5});write(tx.b,{size:9.3,gap:2})});
      if(kind==="L"&&t===3){write(es?"Transcripción":"Transcript",{size:10,style:"bold",gap:0.5});write(task.s.map(([ro,tx])=>`${task.names[ro]}: ${tx}`).join("\n"),{size:9.3,gap:2})}
      if(kind==="L"&&t===4){write(task.opts.map((o,v)=>`${LET4[v]}. ${o}`).join("\n"),{size:9.5,gap:2})}
      line();
      items.filter(i=>i.t===t).forEach(it=>{
        const right=isRight(it),v=r.ans[it.n];need(20);
        write(`${it.n}.  ${right?(es?"CORRECTA":"CORRECT"):v===undefined?(es?"SIN RESPONDER":"NOT ANSWERED"):(es?"INCORRECTA":"WRONG")}`,{size:8.5,style:"bold",color:right?ok:bad,gap:0.5});
        if(kind==="R"&&t===2){const tx=task.texts[it.x];write(`${tx.h}: ${tx.b}`,{size:9.3,color:grey,gap:1})}
        if(kind==="L"&&(t===1||t===2||t===4))write((es?"Audio: ":"Audio: ")+it.script.map(([ro,tx])=>ro==="N"?tx:`${ro==="H"?l.h:l.m}: ${tx}`).join(" / "),{size:9,color:grey,gap:1});
        write(qText(it,test),{size:10.5,style:"bold",gap:1});
        if(it.kind==="mc")it.o.forEach((o,i)=>{const isR=i===it.key,isP=i===v;let tag="";if(isR&&isP)tag=es?"   <- tu respuesta (correcta)":"   <- your answer (correct)";else if(isR)tag=es?"   <- respuesta correcta":"   <- correct answer";else if(isP)tag=es?"   <- tu respuesta":"   <- your answer";
          write(`${LET[i]})  ${o}${tag}`,{size:10,indent:4,style:isR||isP?"bold":"normal",color:isR?ok:isP?bad:ink,gap:0.4})});
        else{write(`${l.yourAns}: ${ansText(it,v,test)}`,{size:10,indent:4,style:"bold",color:right?ok:bad,gap:0.4});if(!right)write(`${l.rightAns}: ${ansText(it,it.key,test)}`,{size:10,indent:4,style:"bold",color:ok,gap:0.4})}
        if(it.why){y+=0.8;write(`${l.why} ${it.why}`,{size:9.3,indent:4,color:grey,gap:0})}
        y+=2;line();
      });
    });
    const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...grey);doc.text(pdfTxt(es?"Material de práctica original en formato DELE A2. No oficial.":"Original DELE A2-format practice material. Not official."),M,292);doc.text(`${p} / ${n}`,W-M,292,{align:"right"})}
    const blob=doc.output("blob"),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`dele-a2-${test.id}-${new Date(r.start).toISOString().slice(0,10)}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);say(l.pdfOk);
  }catch(e){say(l.pdfErr)}
}
I18N.es.time="Tiempo";I18N.en.time="Time";

/* ---------- root ---------- */
function render(){
  clearInterval(tick);renderTabs();
  if(S.run){renderRun();return}
  if(S.tab==="home")renderHome();else renderList(S.tab);
}
window.addEventListener("beforeunload",e=>{if(S.run&&S.run.mode==="exam"&&!S.run.done){e.preventDefault();e.returnValue=""}});
const h=(location.hash||"").slice(1);if(["home","R","L"].includes(h))S.tab=h;
render();
</script>
